}

/* ── 面板：開一個專案／改這個專案 ── */
async function panelProjectEdit(P){
  const isNew=!P;
  const M={
    name:isNew?'':P.name,note:isNew?'':(P.note||''),
    startDate:isNew?'':(P.startDate||''),endDate:isNew?'':(P.endDate||''),
    p:isNew?[]:(P.photoCats||[]).map(c=>Object.assign({},c)),
    n:isNew?[]:(P.noteCats||[]).map(c=>Object.assign({},c)),
    moves:{p:{},n:{}},moving:null
  };
  // 每個分類裡有多少東西（不管是誰放的）。刪有東西的分類時要問搬去哪
  const base={p:{},n:{}};
  if(!isNew&&S.proj){
    (S.proj.photos||[]).forEach(x=>base.p[x.projectCat]=(base.p[x.projectCat]||0)+1);
    (S.proj.notes||[]).forEach(x=>base.n[x.projectCat]=(base.n[x.projectCat]||0)+1);
  }
  const count=(k,id)=>{
    let n=base[k][id]||0;
    Object.keys(M.moves[k]).forEach(from=>{if(M.moves[k][from]===id)n+=base[k][from]||0;});
    return n;
  };

  const v=panel(`<h3>${esc(isNew?PT('new','開一個專案'):PT('editProject','改這個專案'))}</h3>
    <p class="plabel">${esc(PT('name','名稱'))}</p>
    <div class="field"><input id="pn" maxlength="40" value="${esc(M.name)}"></div>
    <p class="plabel">${esc(PT('noteLabel','一句話（可以不寫）'))}</p>
    <div class="field"><input id="pd" maxlength="200" value="${esc(M.note)}"></div>
    <p class="plabel">${esc(PT('dates','日期（可以不填）'))}</p>
    <div class="dates"><div class="field"><input type="date" id="ps" value="${esc(M.startDate)}"></div>
      <div class="field"><input type="date" id="pe" value="${esc(M.endDate)}"></div></div>
    <div id="tpl"></div>
    <p class="plabel">${esc(PT('photoCats','照片的分類'))}</p>
    <div id="cl-p"></div>
    <button class="btn plain" data-addc="p"><span>${esc(PT('addCat','＋ 新增分類'))}</span></button>
    <p class="plabel">${esc(PT('noteCats','文字的分類'))}</p>
    <div id="cl-n"></div>
    <button class="btn plain" data-addc="n"><span>${esc(PT('addCat','＋ 新增分類'))}</span></button>
    ${isNew?'':`<div class="pdanger" id="pdz">
      <button class="btn plain" id="pclose"><span>${esc(P.status==='closed'?PT('reopen','重新打開'):PT('close','收起來'))}</span></button>
      <p class="cap sys" style="margin:4px 0 0">${esc(P.status==='closed'?PT('reopenNote','打開後會回到「這個月」最上面'):PT('closeNote','收起來後卡片會從「這個月」拿掉，在「回頭看」裡還找得到'))}</p>
      <button class="btn plain" id="pdel" style="margin-top:14px"><span style="color:#A3502A">${esc(PT('delete','刪除這個專案'))}</span></button>
    </div>`}
    <div class="err" id="e"></div>
    <div class="row">${btn(tf('ui.close','關起來'),'','id="no"')}${btn(tf('ui.save','存好'),'warm','id="ok"')}</div>`);
  const E=v.querySelector('#e');
  v.querySelector('#no').onclick=()=>v.remove();
  const bindText=(sel,key)=>{const el=v.querySelector(sel);el.oninput=()=>{M[key]=el.value;};};
  bindText('#pn','name');bindText('#pd','note');bindText('#ps','startDate');bindText('#pe','endDate');

  const row=(k,c,i)=>{
    const n=count(k,c.id);
    const moving=M.moving&&M.moving.k===k&&M.moving.id===c.id;
    const others=M[k].filter(x=>x.id!==c.id);
    return `<div class="crow ${c.hidden?'hid':''}">
      <div class="field"><input data-cn="${k}:${i}" maxlength="30" value="${esc(c.name)}" placeholder="${esc(PT('catHint','分類名稱'))}"></div>
      <div class="cbtns">
        <span class="cnum">${n||''}</span>
        <button class="cb" data-up="${k}:${i}" ${i===0?'disabled':''}>↑</button>
        <button class="cb" data-dn="${k}:${i}" ${i===M[k].length-1?'disabled':''}>↓</button>
        ${k==='n'?`<button class="cb ${c.notify?'on':''}" data-nt="${i}">${esc(PT('notify','通知'))}</button>`:''}
        <button class="cb" data-hd="${k}:${i}">${esc(c.hidden?PT('show','顯示'):PT('hide','藏'))}</button>
        <button class="cb del" data-rm="${k}:${i}">✕</button>
      </div>
      ${moving?`<div class="cmove">
        <p class="cap sys" style="margin:0">${esc(PT('moveAsk','裡面有 {n} 個，要搬去哪一個分類？',{n}))}</p>
        ${others.length?`<div class="choices">${others.map(o=>`<button class="chip" data-mv="${k}:${esc(o.id)}">${esc(o.name||'—')}</button>`).join('')}
          <button class="chip" data-mvx="1">${esc(PT('cancel','算了'))}</button></div>`
          :`<p class="cap sys" style="margin:6px 0 0">${esc(PT('moveNone','要先有另一個分類才能搬。不想看到它，可以按「藏」'))}</p>`}
      </div>`:''}
    </div>`;
  };
  const draw=()=>{
    ['p','n'].forEach(k=>{
      const el=v.querySelector('#cl-'+k);
      el.innerHTML=M[k].length?M[k].map((c,i)=>row(k,c,i)).join('')
        :`<p class="cap sys" style="margin:4px 0">${esc(PT('noCat','還沒有'))}</p>`;
      paintFields(el);
    });
    const ki=s=>{const [k,i]=s.split(':');return [k,Number(i)];};
    v.querySelectorAll('[data-cn]').forEach(el=>el.oninput=()=>{const [k,i]=ki(el.dataset.cn);M[k][i].name=el.value;});
    v.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const [k,i]=ki(b.dataset.up);
      if(i>0){const a=M[k];[a[i-1],a[i]]=[a[i],a[i-1]];draw();}});
    v.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const [k,i]=ki(b.dataset.dn);
      const a=M[k];if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];draw();}});
    v.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{const c=M.n[Number(b.dataset.nt)];c.notify=!c.notify;draw();});
    v.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{const [k,i]=ki(b.dataset.hd);M[k][i].hidden=!M[k][i].hidden;draw();});
    v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      const [k,i]=ki(b.dataset.rm);const c=M[k][i];
      if(!count(k,c.id)){M[k].splice(i,1);M.moving=null;draw();return;}
      M.moving={k,id:c.id};draw();
    });
    v.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.mv.slice(0,1),to=b.dataset.mv.slice(2),from=M.moving.id;
      // 之前搬進這個分類的，也一起改搬到新的地方，不然後端會找不到落腳處
      Object.keys(M.moves[k]).forEach(x=>{if(M.moves[k][x]===from)M.moves[k][x]=to;});
      M.moves[k][from]=to;
      M[k]=M[k].filter(x=>x.id!==from);M.moving=null;draw();
    });
    v.querySelectorAll('[data-mvx]').forEach(b=>b.onclick=()=>{M.moving=null;draw();});
  };
  draw();
  v.querySelectorAll('[data-addc]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.addc;M[k].push(k==='n'?{id:newCatId(),name:'',hidden:false,notify:false}:{id:newCatId(),name:'',hidden:false});
    draw();
    const ins=v.querySelectorAll(`#cl-${k} input[data-cn]`);if(ins.length)ins[ins.length-1].focus();
  });

  // 新專案：可以沿用之前某個專案的分類
  if(isNew){
    let list=S.plist;
    if(!list){try{list=await api('listProjects',{});S.plist=list;}catch(e){list=[];}}
    const usable=(list||[]).filter(p=>(p.photoCats||[]).length||(p.noteCats||[]).length);
    if(usable.length){
      const tp=v.querySelector('#tpl');
      tp.innerHTML=`<p class="plabel">${esc(PT('template','沿用之前的分類'))}</p>
        <div class="choices">${usable.map(p=>`<button class="chip" data-tp="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>`;
      tp.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{
        const src=usable.filter(p=>p.id===b.dataset.tp)[0];if(!src)return;
        M.p=(src.photoCats||[]).filter(c=>!c.hidden).map(c=>({id:newCatId(),name:c.name,hidden:false}));
        M.n=(src.noteCats||[]).filter(c=>!c.hidden).map(c=>({id:newCatId(),name:c.name,hidden:false,notify:!!c.notify}));
        tp.querySelectorAll('[data-tp]').forEach(x=>x.classList.toggle('on',x===b));
        draw();
      });
    }
  }

  if(!isNew){
    v.querySelector('#pclose').onclick=async()=>{
      try{
        const next=P.status==='closed'?'open':'closed';
        await saveProjectWith(P,{status:next});
        v.remove();await reloadProject();refresh().catch(()=>{});
      }catch(e){E.textContent=e.message;}
    };
    v.querySelector('#pdel').onclick=()=>{
      const z=v.querySelector('#pdz');
      z.innerHTML=`<p class="note" style="margin-top:0">${esc(PT('deleteNote','刪除後兩個人都看不到這個專案，裡面的照片和文字也一起不見。真的要刪嗎？'))}</p>
        <div class="row" style="margin-top:12px">${btn(PT('cancel','算了'),'','id="dno"')}${btn(PT('deleteYes','刪除'),'danger','id="dyes"')}</div>`;
      paintButtons(z);
      z.querySelector('#dno').onclick=()=>{v.remove();panelProjectEdit(P);};
      z.querySelector('#dyes').onclick=async()=>{
        const y=z.querySelector('#dyes');y.disabled=true;
        try{
          await api('deleteProject',{id:P.id,confirm:'yes'});
          v.remove();S.tab='month';S.pid=null;S.proj=null;S.plist=null;await refresh();
        }catch(e){y.disabled=false;E.textContent=e.message;}
      };
    };
  }

  const ok=v.querySelector('#ok');
  ok.onclick=async()=>{
    if(!M.name.trim()){E.textContent=PT('needName','專案要有名字');return;}
    if(M.moving){E.textContent=PT('pickMove','還有一個分類沒選要搬去哪');return;}
    const clean=a=>a.filter(c=>c.name.trim());
    ok.disabled=true;E.innerHTML='<span class="spin"></span>';
    try{
      const body={name:M.name,note:M.note,startDate:M.startDate,endDate:M.endDate,
        photoCats:clean(M.p),noteCats:clean(M.n),movePhotos:M.moves.p,moveNotes:M.moves.n};
      if(isNew){
        const r=await api('saveProject',body);
        v.remove();S.plist=null;
        await openProject(r.id);refresh().catch(()=>{});
      }else{
        await saveProjectWith(P,body);
        v.remove();S.plist=null;await reloadProject();refresh().catch(()=>{});
      }
    }catch(e){ok.disabled=false;E.textContent=e.message;}
  };
}

   加到主畫面．推播

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone===true;
}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent);}

async function initPush(){
  if(!('serviceWorker' in navigator))return;
  try{
    await navigator.serviceWorker.register('./firebase-messaging-sw.js');
  }catch(e){return;}
  if(Notification.permission==='granted')await grabToken();
  S.swReady=true;
}

/** 拿裝置代號送回後端，順便留下心跳。每次打開都做一次。 */
/** 回傳 {ok, why}。why 是給人看的，不是給程式判斷的。 */
async function grabToken(){
  if(typeof FIREBASE_CONFIG==='undefined')
    return {ok:false,why:'讀不到 config.js'};
  if(!FIREBASE_CONFIG.projectId)
    return {ok:false,why:'config.js 裡的 projectId 是空的'};
  if(!VAPID_KEY)
    return {ok:false,why:'config.js 裡的 VAPID_KEY 是空的（手機可能還在讀舊版，重新整理一次）'};
  try{
    if(!window.firebase){
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
  }catch(e){return {ok:false,why:'載不到 Firebase 的程式（網路或擋廣告的擴充功能）'};}
  let reg;
  try{ reg=await navigator.serviceWorker.ready; }
  catch(e){return {ok:false,why:'背景執行緒沒起來（firebase-messaging-sw.js 沒上傳？）'};}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    const tok=await firebase.messaging().getToken(
      {vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!tok)return {ok:false,why:'Firebase 沒給代號'};
    await api('registerPush',{fcmToken:tok});
    watchForeground();
    return {ok:true,why:'已登記，代號結尾 …'+tok.slice(-8)};
  }catch(e){
    return {ok:false,why:'Firebase：'+String(e&&e.message||e).slice(0,140)};
  }
}
/**
 * app 開著的時候，推播不會走系統通知，會走這裡。
 * Firebase 的背景執行緒只在 app 沒開的時候接管。
 */
function watchForeground(){
  try{
    firebase.messaging().onMessage(async function(payload){
      const n=(payload&&payload.notification)||{};
      const title=n.title||t('app.name'), body=n.body||'';
      toast(title,body);
      // 開著也要系統通知的話，自己叫背景執行緒發一則。
      if(localStorage.getItem(LS.fgSys)==='1'){
        try{
          const reg=await navigator.serviceWorker.ready;
          reg.showNotification(title,{body:body,icon:'./icon-192.png',
            badge:'./icon-192.png',tag:'junou-fg',renotify:true});
        }catch(e){}
      }
    });
  }catch(e){}
}

function toast(title,body){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML='<div class="t">'+esc(title)+'</div><div class="b">'+esc(body)+'</div>';
  el.onclick=()=>el.remove();
  document.body.appendChild(el);
  setTimeout(()=>{if(el.parentNode)el.remove();},7000);
}

function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}

async function askPush(){
  if(!('Notification' in window))return '這個瀏覽器不支援通知';
  if(!isStandalone()&&isIOS())return '在 iPhone 上要先加到主畫面才收得到';
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return '你選了不接收';
  const r=await grabToken();
  return r.ok?'好了，這台裝置會收到':r.why;
}

function panelSettings(){
  const push=(typeof Notification!=='undefined')?Notification.permission:'unsupported';
  const cfgOk=(typeof VAPID_KEY!=='undefined'&&VAPID_KEY)?'':'　⚠ 讀不到 VAPID_KEY';
  const pushLine=push==='granted'?'這台裝置會收到'+cfgOk
    :push==='denied'?'你之前選了不接收，要到瀏覽器設定裡改'+cfgOk
    :'還沒開。沒開的話提醒會用 Email 寄'+cfgOk;
  const installLine=isStandalone()?'已經在主畫面上了'
    :isIOS()?'按瀏覽器的分享鍵，選「加入主畫面」'
    :deferredInstall?'裝起來就會像一個 app':'從瀏覽器選單選「安裝」或「加到主畫面」';

  const v=panel(`<h3>${esc(tf('set.title','設定'))}</h3>
    <div class="set-row">
      <div><div class="t">${esc(tf('set.push','提醒'))}</div><div class="s" id="ps">${esc(pushLine)}</div></div>
      ${btn(push==='granted'?tf('set.pushAgain','重新登記'):tf('set.pushOn','開啟'),'warm','id="onpush"')}
    </div>
    <div class="set-row">
      <div><div class="t">${esc(tf('set.fgSystem','開著也要系統通知'))}</div>
        <div class="s">${esc(tf('set.fgNote','關掉的話，app 開在眼前時只會在畫面上顯示'))}</div></div>
      <button class="chip ${localStorage.getItem(LS.fgSys)==='1'?'on':''}" id="fgsys"
        >${localStorage.getItem(LS.fgSys)==='1'?esc(tf('ui.on','開')):esc(tf('ui.off','關'))}</button>
    </div>
    <div class="set-row">
      <div><div class="t">${esc(tf('set.install','加到主畫面'))}</div><div class="s">${esc(installLine)}</div></div>
      ${(!isStandalone()&&deferredInstall)?btn(tf('set.installNow','裝起來'),'','id="oninstall"'):''}
    </div>
    <div class="set-row">
      <div><div class="t">${esc(tf('set.who','目前是'))}</div><div class="s">${esc(S.user)}</div></div>
      ${btn(tf('set.switch','換人'),'','id="logout"')}
    </div>

    <div class="set-row">
      <div><div class="t">${esc(tf('set.version','版本'))}</div><div class="s">${esc(BUILD)}</div></div>
      ${btn(tf('set.bust','清快取重載'),'','id="bust"')}
    </div>

    <div class="dormant">
      <div class="t">${esc(t('archive.title'))}</div>
      <div class="s" style="margin-top:6px">${esc(t('archive.body'))}</div>
    </div>
    <div class="row">${btn(tf('ui.close','關起來'),'','id="no"')}</div>`);

  v.querySelector('#no').onclick=()=>v.remove();
  const op=v.querySelector('#onpush');
  if(op)op.onclick=async()=>{
    op.disabled=true;v.querySelector('#ps').textContent='問一下瀏覽器…';
    v.querySelector('#ps').textContent=await askPush();
  };
  const fg=v.querySelector('#fgsys');
  if(fg)fg.onclick=()=>{
    const on=localStorage.getItem(LS.fgSys)==='1';
    if(on)localStorage.removeItem(LS.fgSys);else localStorage.setItem(LS.fgSys,'1');
    fg.classList.toggle('on',!on);fg.textContent=on?tf('ui.off','關'):tf('ui.on','開');
  };
  const oi=v.querySelector('#oninstall');
  if(oi)oi.onclick=async()=>{
    if(!deferredInstall)return;
    deferredInstall.prompt();await deferredInstall.userChoice;
    deferredInstall=null;v.remove();
  };
  v.querySelector('#bust').onclick=async()=>{
    // 把本地存的東西清掉再重載，用來確認拿到的是最新的檔案
    try{localStorage.removeItem(CACHE);}catch(e){}
    if('caches' in window){
      try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
    }
    if('serviceWorker' in navigator){
      try{const rs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r=>r.update()));}catch(e){}
    }
    location.reload(true);
  };
  v.querySelector('#logout').onclick=async()=>{
    localStorage.removeItem(LS.token);localStorage.removeItem(CACHE);
    if('caches' in window){try{await caches.delete('junou-photos-v1');}catch(e){}}
    location.reload();
  };
}

/* 第一次進來、還沒裝到主畫面時的邀請。只出現一次。 */
function maybeInvite(){
  if(isStandalone()||localStorage.getItem('jo.invited'))return;
  if(!deferredInstall&&!isIOS())return;
  localStorage.setItem('jo.invited','1');
  setTimeout(()=>{
    const v=panel(`<h3>放到主畫面上吧</h3>
      <p class="note">這樣它就會有自己的位子，跟其他 app 一樣。
      ${isIOS()?'按瀏覽器下面的分享鍵，往下選「加入主畫面」。':''}</p>
      <div class="row">${btn(tf('ui.later','等一下再說'),'','id="no"')}${deferredInstall?btn('好','warm','id="yes"'):''}</div>`);
    v.querySelector('#no').onclick=()=>v.remove();
    const y=v.querySelector('#yes');
    if(y)y.onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;
      deferredInstall=null;v.remove();};
  },1400);
}

/* ══════════════════════════════════════════
   把主機商注入的浮動標記移掉
   它會蓋住底部的分頁，讓最右邊兩個按不到。
   ══════════════════════════════════════════ */
function sweepBadges(){
  const kill=()=>{
    [].slice.call(document.body.children).forEach(el=>{
      if(el.id==='app'||el.id==='ink-defs'||el.classList.contains('veil')
        ||el.classList.contains('toast'))return;
      const cs=getComputedStyle(el);
      if(cs.position!=='fixed')return;
      const txt=(el.textContent||'').toLowerCase();
      const mark=(el.id+' '+el.className).toLowerCase();
      if(txt.indexOf('netlify')>=0||mark.indexOf('netlify')>=0
        ||el.tagName==='IFRAME'||el.tagName==='NETLIFY-BADGE'){
        el.remove();
      }
    });
  };
  kill();
  const mo=new MutationObserver(kill);
  mo.observe(document.body,{childList:true});
  setTimeout(()=>mo.disconnect(),60000);
}

/* ══════════════════════════════════════════
   啟動
   ══════════════════════════════════════════ */
async function loadHut(){
  S.hut=await api('hut',{});
}

async function refresh(){
  const o=await api('open',S.ym?{yearMonth:S.ym}:{});
  soakOpen(o);
  if(S.tab==='hut'&&!S.hut)await loadHut();
  render();
}

const CACHE='jo.cache.open';

function soakOpen(o){
  S.user=o.user;S.partner=o.partner;S.stamps=o.stamps;S.stampSets=o.stampSets;
  S.copy=o.copy;S.settings=o.settings;S.view=o.month;S.pending=o.pending||[];
  S.months=o.months||[];S.unseen=o.unseen||[];S.projects=o.projects||[];
  try{localStorage.setItem(CACHE,JSON.stringify(o));}catch(e){}
}

/** 上次開啟時存下來的東西。用來先把畫面畫出來，不用等後端。 */
function driedOpen(){
  try{
    const raw=localStorage.getItem(CACHE);
    if(!raw)return null;
    const o=JSON.parse(raw);
    return (o&&o.user&&o.copy&&o.month)?o:null;
  }catch(e){return null;}
}

async function boot(){
  // 先用上次的資料畫一次，畫面立刻就有東西。
  // 後端回來之後再重畫一次，數字和照片才會是最新的。
  const cold=driedOpen();
  if(cold){
    S.user=cold.user;S.partner=cold.partner;S.stamps=cold.stamps;S.stampSets=cold.stampSets;
    S.copy=cold.copy;S.settings=cold.settings;S.view=cold.month;
    S.pending=cold.pending||[];S.months=cold.months||[];S.unseen=cold.unseen||[];
    render();
  }
  try{
    await refresh();
    initPush();
    if(localStorage.getItem(LS.seen)){
      if(S.unseen&&S.unseen.length){
        setTimeout(()=>panelReveal(S.unseen[S.unseen.length-1]),700);
      }else{
        maybeInvite();
      }
    }
  }catch(e){
    const msg=String(e.message||'');
    if(msg.indexOf('unauthorized')>=0){
      localStorage.removeItem(LS.token);S.token='';
      localStorage.removeItem(CACHE);screenLogin('');
    }else if(cold){
      // 已經用快取畫出畫面了，連不上就先讓人看著舊的
      toast('離線','連不上，你看到的是上次的樣子');
    }else{
      screenLogin(msg||'連不上，等一下再試');
    }
  }
}

/** 卡片上的 QR 會把登入碼放在網址後面，掃進來就直接進去，不用輸入。 */
async function tokenFromLink(){
  const raw=(location.hash||'').replace(/^#/,'').trim();
  if(!raw||!/^[a-z0-9]{12,40}$/.test(raw))return false;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const j=await post(S.url,{action:'login',code:raw});
    if(!j.ok||!j.data)return false;
    S.token=j.data.token;S.user=j.data.user;S.partner=j.data.partner;
    localStorage.setItem(LS.token,S.token);
    localStorage.removeItem(CACHE);
    return true;
  }catch(e){return false;}
}

(async function(){
  washDefs();
  if(document.readyState==='loading')
    document.addEventListener('DOMContentLoaded',sweepBadges);
  else sweepBadges();
  if(!S.url){screenSetup();return;}
  if(!S.token&&location.hash){
    if(await tokenFromLink()){await boot();return;}
  }
  if(!S.token){screenLogin();return;}
  boot();
})();
