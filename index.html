<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EC">
<title>OJ book</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OJ book">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.2.0/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EC;
  --paper-2:#F2EAD8;
  --ink:#2B2724;
  --ink-soft:#6E655B;
  --ink-faint:#B0A492;
  --ochre:#C98A3C;
  --blue:#7A93A3;
  --sage:#8B9B72;
  --rose:#C08A7C;   /* 原本有用到卻沒定義，「想跟你說的話」一直被畫成黑色 */
  --brush:'LXGW WenKai TC','Klee One',"Noto Serif TC",serif;
  --ledger:'IBM Plex Mono',ui-monospace,monospace;
  --sheet:min(480px,100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--brush);
  font-size:17px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  width:var(--sheet);
  margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 28px) 22px
          calc(env(safe-area-inset-bottom) + 110px);
  min-height:100vh;
}
.led{font-family:var(--ledger);font-size:.78rem;letter-spacing:.06em;color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
h1,h2,h3{font-weight:400;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:transparent;border:0;width:100%}
input:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--ochre);outline-offset:3px;border-radius:2px}
.hide{display:none !important}

/* ── 手繪線的輸入框 ── */
.field{position:relative;padding:10px 2px 12px}
.field input,.field textarea{position:relative;z-index:1;resize:none}
.field svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.field path{fill:var(--ink-faint);stroke:none}
.field:focus-within path{fill:var(--ochre)}
/* 聚焦時底線已經會變色，瀏覽器自己的外框是多的 */
.field input:focus,.field textarea:focus{outline:none}
::placeholder{color:var(--ink-faint);opacity:1}

/* ── 按鈕 ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;
  padding:11px 26px;min-height:46px}
.btn span{position:relative;z-index:1}
.btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.btn path{fill:var(--ink);stroke:none;fill-rule:evenodd}
.btn.warm path{fill:var(--ochre)}
.btn.warm span{color:#8E5F1E}
.btn.plain{padding:6px 4px;min-height:0}
.btn.plain svg{display:none}
.btn.plain span{border-bottom:1.4px solid var(--ink-faint);padding-bottom:2px}
.btn[disabled]{opacity:.4;cursor:default}
.btn:active:not([disabled]){transform:translateY(1px)}

/* ── 頭 ── */
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.head .ym{font-size:1.55rem;letter-spacing:.04em}
.head .ymwrap{display:flex;align-items:baseline;gap:4px}
.step{font-family:var(--ledger);font-size:1.05rem;color:var(--ink-faint);
  padding:2px 7px;line-height:1.2}
.step:not([disabled]){color:var(--ink-soft)}
.step[disabled]{opacity:.28}
.backnow{font-family:var(--ledger);font-size:.7rem;letter-spacing:.06em;
  color:var(--ochre);padding:3px 0;margin-left:2px}
.rule{height:14px;margin:14px 0 26px}
.rule svg{width:100%;height:100%;overflow:visible}
.rule path{fill:var(--ink);stroke:none;opacity:.42}

/* ── 相框 ── */
.group{margin-bottom:30px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.group-head.stack{display:block}
.group-head.stack .row1{display:flex;align-items:baseline;gap:10px}
.group-head h2{font-size:1.12rem}
.group-head .sub{font-size:.86rem;color:var(--ink-soft);line-height:1.7;margin-top:2px}
.grid{display:grid;column-gap:15px;row-gap:19px}
.grid.self{grid-template-columns:1fr 1fr}
/* 配額多的時候改成三欄。格子小一點，密度本身就在說這些照片比較日常。 */
.grid.self.dense{grid-template-columns:repeat(3,1fr);column-gap:11px;row-gap:14px}
.grid.self.dense .frame .tag{left:4px;bottom:4px;font-size:.6rem;padding:0 5px}
.grid.self.dense .frame .tag.mark{left:auto;right:4px}
.grid.self.dense .slot{font-size:1.15rem}
.grid.us{grid-template-columns:1fr 1fr}
.grid.me{grid-template-columns:1fr 1fr}
.frame{position:relative;width:100%;padding:0;display:block}
.frame.sq{aspect-ratio:1/1}
.frame.wide{aspect-ratio:4/3}
.frame.tall{aspect-ratio:3/4}
.frame .line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;pointer-events:none}
.frame .line path{fill:var(--ink);stroke:none;fill-rule:evenodd}
.frame.empty .line path{fill:var(--ink-faint);opacity:.85}
.frame.us .line path.second{opacity:.5}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
  opacity:0;transition:opacity .5s ease}
.frame img.in{opacity:1}
.frame .slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:3;color:var(--ink-faint);font-family:var(--ledger);font-size:1.5rem}
.frame.empty{cursor:pointer}
.frame.empty:hover .line path{fill:var(--ochre);opacity:1}
.frame.willful .line path{fill:var(--ochre);opacity:.55}
.frame.willful:hover .line path{opacity:.9}
.frame.willful .slot{flex-direction:column;gap:3px;color:#B0803A;font-family:var(--brush);font-size:.9rem}
.frame.willful .slot em{font-style:normal;font-family:var(--ledger);font-size:1.15rem;opacity:.7}
.frame .tag{position:absolute;left:7px;bottom:7px;z-index:4;font-family:var(--ledger);
  font-size:.66rem;letter-spacing:.05em;color:#8E5F1E;background:rgba(250,246,236,.9);
  padding:1px 7px;border-radius:999px}
.frame .tag.mark{left:auto;right:7px}
.frame.covered .cover{position:absolute;inset:0;z-index:3;border-radius:3px;
  background:repeating-linear-gradient(-45deg,transparent 0 7px,rgba(122,147,163,.22) 7px 8px)}
.group.opposite .frame .line path{fill:var(--blue);opacity:.65}
.cap{margin:26px 0 0;font-size:.95rem;line-height:1.7}
.cap.sys{font-family:var(--ledger);font-size:.78rem;letter-spacing:.05em;color:var(--ink-soft)}

/* ── 底部 ── */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);z-index:2147483000}
.nav .inner{width:var(--sheet);margin:0 auto;display:flex;justify-content:space-around;
  padding:0 22px;border-top:1.3px solid rgba(43,39,36,.14)}
.nav button{padding:12px 8px;font-size:.95rem;color:var(--ink-soft);position:relative}
.nav button.on{color:var(--ink)}
.nav button.on::after{content:'';position:absolute;left:50%;bottom:6px;width:5px;height:5px;
  margin-left:-2.5px;border-radius:50%;background:var(--ochre)}
.nav button[disabled]{opacity:.32}

/* ── 覆蓋層 ── */
.veil{position:fixed;inset:0;background:rgba(43,39,36,.28);z-index:2147483600;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.panel{width:var(--sheet);max-height:92vh;overflow-y:auto;background:var(--paper);
  border-radius:16px 16px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 34px);
  animation:rise .28s cubic-bezier(.2,.8,.3,1)}
.panel h3{font-size:1.2rem;margin-bottom:6px;padding-right:34px}
.panel .x{position:absolute;top:14px;right:14px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;
  color:var(--ink-faint);line-height:1;z-index:5}
.panel .x:active{color:var(--ink)}
.panel{position:relative}
.danger span{color:#A3502A}
.danger path{fill:#A3502A}
.q .meta .btn.plain span{border-bottom-color:var(--ink-faint)}
.panel .row{display:flex;gap:10px;align-items:stretch;margin-top:22px}
.panel .row .btn span{white-space:nowrap}
.panel .row .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.preview{display:block;width:100%;max-height:46vh;object-fit:contain;
  border-radius:3px;margin:2px auto 16px}
.choices{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 4px}
.chip{padding:7px 15px;border:1.4px solid var(--ink-faint);border-radius:999px;
  font-size:.92rem;color:var(--ink-soft)}
.chip.on{border-color:var(--ochre);color:#8E5F1E;background:rgba(201,138,60,.09)}
.note{font-size:.9rem;color:var(--ink-soft);line-height:1.7;margin-top:10px}
.err{color:#A3502A;font-size:.9rem;margin-top:10px;min-height:1.2em}

/* ── 金句本 ── */
.q{padding:18px 0 4px 14px;position:relative}
.q+.q{border-top:1px solid rgba(43,39,36,.09)}
.q::before{content:'';position:absolute;left:0;top:20px;bottom:8px;width:2px;
  border-radius:2px;background:var(--qc);opacity:.5}
.q[data-kind="quote"]{--qc:var(--ochre)}
.q[data-kind="note"]{--qc:var(--sage)}
.q[data-kind="ask"]{--qc:var(--blue)}
.q[data-kind="say"]{--qc:var(--rose)}
.q .lab{font-family:var(--ledger);font-size:.65rem;letter-spacing:.09em;
  color:var(--qc);opacity:.9;margin-bottom:4px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.filters .chip{padding:5px 12px;font-size:.8rem}
.filters .chip .n{font-family:var(--ledger);font-size:.68rem;opacity:.7;margin-left:5px}
.q .txt{font-size:1.06rem;line-height:1.9}
.q .meta{margin-top:7px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q .who{font-family:var(--ledger);font-size:.7rem;letter-spacing:.05em;color:var(--ink-faint)}
.q .src{font-size:.88rem;color:var(--ink-soft)}
/* ── 內文裡的網址 ── */
.q .txt a.ln{color:#A26A22;text-decoration:none;
  border-bottom:1.4px solid rgba(201,138,60,.5);
  font-family:var(--ledger);font-size:.88em;
  word-break:break-all;padding-bottom:1px}
.q .txt a.ln:active{border-bottom-color:var(--ochre)}
/* ── 內文下方長出來的連結按鈕 ── */
.q .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.btn.link{padding:7px 15px;min-height:0;max-width:100%;text-decoration:none}
.btn.link span{font-family:var(--ledger);font-size:.78rem;letter-spacing:.02em;
  color:#A26A22;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.link path{fill:var(--ochre);opacity:.75}
.stamps{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.st{padding:4px 11px;border:1.2px solid rgba(43,39,36,.16);border-radius:999px;
  font-size:.78rem;color:var(--ink-faint);line-height:1.5}
.st.mine{border-color:var(--ochre);color:#8E5F1E;background:rgba(201,138,60,.1)}
.st.theirs{border-color:var(--blue);color:#4F6674;background:rgba(122,147,163,.12)}
.stamps.solo .st{padding:6px 18px;font-size:.9rem}
.add-fab{margin:26px 0 0}

/* ── 三扇門 ── */
.doors{margin-top:28px;display:flex;flex-direction:column;gap:11px}
/* 門放在最上面時縮成兩欄，寫字的地方永遠一伸手就到 */
.doors.top{margin:6px 0 24px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.doors.top .door{padding:11px 13px}
.doors.top .door span{font-size:.86rem;line-height:1.5}
.qmonth{margin-top:4px}
.qm-h{display:flex;align-items:baseline;gap:10px;width:100%;padding:13px 2px 9px;text-align:left;
  border-bottom:1px dashed rgba(0,0,0,.14)}
.qm-h .mm{font-size:1.02rem;letter-spacing:.04em}
.qm-h .n{font-family:var(--ledger);font-size:.72rem;color:var(--ink-soft)}
.qm-h .go{margin-left:auto;font-family:var(--ledger);color:var(--ink-faint)}
.qm-h.on .mm{color:#8E5F1E}

/* ── 獨立專案 ── */
.pback{font-family:var(--ledger);font-size:.78rem;letter-spacing:.05em;color:var(--ink-soft);
  padding:2px 0 14px;position:relative;z-index:1}
.pcards{display:flex;flex-direction:column;gap:9px;margin:18px 0 2px}
.pcard{width:100%;padding:13px 16px}
.door.pcard path{fill:var(--blue);opacity:.75}
.pcard span{display:flex;align-items:baseline;gap:10px;width:100%}
.pcard b{font-weight:normal;font-size:1.02rem}
.pcard em{font-style:normal;font-family:var(--ledger);font-size:.72rem;color:var(--ink-soft)}
.pcard i{font-style:normal;margin-left:auto;color:var(--ink-faint)}
.psec{margin-top:26px;position:relative;z-index:1}
.psec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.psec-h h2{font-size:1.2rem}
.btn.small{padding:7px 15px;min-height:0}
.btn.small span{font-size:.88rem}
.pgroup{margin-top:20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{position:relative;aspect-ratio:1/1;cursor:pointer}
.ptile img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);
  object-fit:cover;opacity:0;transition:opacity .45s ease;border-radius:2px}
.ptile img.in{opacity:1}
.ptile .line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;pointer-events:none}
.ptile .line path{fill:var(--ink);stroke:none;fill-rule:evenodd;opacity:.8}
.pqueue{margin:2px 0 16px}
.pqueue .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.07);overflow:hidden}
.pqueue .bar i{display:block;height:100%;background:var(--ochre);transition:width .4s ease}
.pqueue .cap{margin-top:7px}
.pqueue .btn{margin-top:8px}
.pnotes{margin-top:38px}
.pnotes .doors.top{margin-top:0}
.pacts{margin-top:14px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
/* 編輯專案 */
.plabel{font-family:var(--ledger);font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);margin:18px 0 0}
.dates{display:flex;gap:12px}
.dates .field{flex:1}
.crow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.crow .field{flex:1;min-width:110px;padding:6px 2px 9px}
.crow.hid .field input{color:var(--ink-faint);text-decoration:line-through}
.cbtns{display:flex;align-items:center;gap:1px}
.cnum{font-family:var(--ledger);font-size:.66rem;color:var(--ink-faint);min-width:18px;text-align:right;margin-right:2px}
.cb{font-family:var(--ledger);font-size:.74rem;padding:7px 7px;color:var(--ink-soft);border-radius:6px}
.cb:disabled{opacity:.25}
.cb.on{color:#9A6357;background:rgba(200,140,130,.14)}
.cb.del{color:#A3502A}
.cmove{width:100%;padding:2px 0 10px}
.pdanger{margin-top:26px;padding-top:14px;border-top:1px dashed rgba(0,0,0,.14)}
/* 誰放的。顏色照名字排序固定，兩支手機上看起來一樣 */
.wtag{display:inline-block;font-family:var(--ledger);font-size:.66rem;letter-spacing:.05em;
  padding:1px 7px;border-radius:999px;line-height:1.6;white-space:nowrap}
.wtag.w0{color:#8E5F1E;background:rgba(201,138,60,.16)}
.wtag.w1{color:#4F6B7A;background:rgba(122,147,163,.18)}
.wtag.onphoto{position:absolute;left:8px;bottom:8px;z-index:3;font-size:.6rem;padding:0 6px}
.wtag.onphoto.w0{background:rgba(250,240,222,.92)}
.wtag.onphoto.w1{background:rgba(232,240,245,.92)}
.wdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.wdot.w0{background:var(--ochre)}
.wdot.w1{background:var(--blue)}
.pmark{position:absolute;right:8px;bottom:8px;z-index:3;font-family:var(--ledger);font-size:.62rem;
  color:var(--ink-soft);background:rgba(250,246,236,.92);padding:0 6px;border-radius:999px;line-height:1.6}
.pmark b{font-weight:normal;margin-left:3px}
.pmeta{display:flex;align-items:center;gap:10px;margin-top:12px}
.pcap{margin-top:8px;white-space:pre-wrap}
.capsave{margin-top:6px}
.cmts{margin-top:6px}
.cmt{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.1);flex-wrap:wrap}
.cmt .ct{flex:1;min-width:60%;font-size:.95rem;line-height:1.7;white-space:pre-wrap}
.cmt .ct a.ln{color:#A26A22;border-bottom:1.4px solid rgba(201,138,60,.5);text-decoration:none;word-break:break-all}
.cmt .cd{font-family:var(--ledger);font-size:.62rem;color:var(--ink-faint)}
.cmt-new{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.cmt-new .field{flex:1}
.qacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.door{position:relative;text-align:left;padding:15px 18px;min-height:0}
.door span{position:relative;z-index:1;font-size:1rem}
.door svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.door path{fill:var(--ink-faint);stroke:none;fill-rule:evenodd}
.door.ask path{fill:var(--ochre);opacity:.75}
.door.ask span{color:#8E5F1E}
.door.say path{fill:var(--rose);opacity:.8}
.door.say span{color:#9A6357}
.door:active{transform:translateY(1px)}

/* ── 抽到的題：霧裡浮現 ── */
.slip{position:relative;margin:6px 0 4px;padding:30px 20px;min-height:116px;
  display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.slip>svg.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2}
.slip>svg.frame path{fill:var(--ochre);stroke:none;fill-rule:evenodd;opacity:.8}
.slip .mist{position:absolute;inset:-24%;z-index:1;opacity:0;
  transition:opacity .8s ease}
.slip.rolling .mist{opacity:1}
.slip.landed .mist{opacity:0;transition:opacity 1.1s ease}
.slip .q{position:relative;z-index:3;font-size:1.12rem;line-height:1.75;
  transition:filter .55s ease,opacity .55s ease,transform .55s ease}
.slip.rolling .q{filter:blur(7px);opacity:.35;transform:scale(.94)}
.slip.landed .q{filter:none;opacity:1;transform:none}
.slip .glow{position:absolute;left:50%;top:50%;width:150%;height:190%;
  transform:translate(-50%,-50%);z-index:0;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(201,138,60,.42),rgba(201,138,60,0));
  transition:opacity .9s ease}
.slip.landed .glow{opacity:0;animation:bloom 1.5s ease-out}
@keyframes bloom{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .slip .q,.slip .mist,.slip .glow{transition:none!important;animation:none!important;filter:none!important}
}

/* ── 對方丟過來的題 ── */
.tossed{position:relative;margin:0 0 22px;padding:18px 18px 16px}
.tossed svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tossed path{fill:var(--blue);stroke:none;fill-rule:evenodd;opacity:.75}
.tossed>*{position:relative;z-index:1}
.tossed .who{font-family:var(--ledger);font-size:.7rem;letter-spacing:.06em;
  color:var(--blue);margin-bottom:5px}
.tossed .qq{font-size:1.06rem;line-height:1.8}
.tossed .acts{display:flex;gap:10px;margin-top:13px}
.nav button .dot{position:absolute;top:8px;right:6px;width:6px;height:6px;
  border-radius:50%;background:var(--ochre)}
.q-tag{font-size:.88rem;color:var(--ink-soft);line-height:1.7;margin-bottom:4px}
.q-tag::before{content:'— ';color:var(--ink-faint)}

<body>

<div id="app"><div class="gate"><p class="led">開啟中 <span class="spin"></span></p></div></div>

<script>
/* ══════════════════════════════════════════
   筆刷
   線條會忽粗忽細，像毛筆壓下去又提起來。
   同一個 seed 永遠畫出同一條線，所以不會抖。
   ══════════════════════════════════════════ */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%1000)/1000}}

/* 二次貝茲取樣 */
function qSample(a,c,b,n,out){
  for(let k=1;k<=n;k++){
    const t=k/n,u=1-t;
    out.push([u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]);
  }
}

/* 抖動的方框 → 一圈取樣點 */
function rectPoints(w,h,seed,slack){
  const r=rng(seed),k=slack===undefined?4.2:slack,j=()=>(r()-.5)*k;
  const p=[[j(),j()],[w+j(),j()],[w+j(),h+j()],[j(),h+j()]];
  const pts=[p[0].slice()];
  for(let i=0;i<4;i++){
    const a=p[i],b=p[(i+1)%4];
    const c=[(a[0]+b[0])/2+(r()-.5)*k*2.1,(a[1]+b[1])/2+(r()-.5)*k*2.1];
    qSample(a,c,b,14,pts);
  }
  return pts;
}

/* 抖動的橫線 → 一串取樣點 */
function linePoints(w,seed,amp){
  const r=rng(seed),a=amp===undefined?2.2:amp;
  const pts=[[0,7]];
  const n=6;
  let prev=[0,7];
  for(let i=1;i<=n;i++){
    const b=[w*i/n, 7+(r()-.5)*a];
    const c=[w*(i-.5)/n, 7+(r()-.5)*a*2];
    qSample(prev,c,b,8,pts); prev=b;
  }
  return pts;
}

/**
 * 把取樣點變成有粗細變化的填色輪廓。
 * closed=true 畫成一圈（框），false 畫成一筆（線，兩端收尖）。
 */
function brush(pts,closed,base,seed,vary){
  const n=pts.length;
  if(n<3)return '';
  const r=rng(seed+733);
  const v=vary===undefined?.55:vary;
  const ph1=r()*6.28, ph2=r()*6.28;
  const wAt=function(i){
    const t=i/(n-1);
    let m=1+v*(Math.sin(t*7.1+ph1)*.6+Math.sin(t*17.3+ph2)*.4);
    if(!closed){                       // 兩端收尖，像起筆和收筆
      const e=Math.min(t,1-t)/.16;
      if(e<1)m*=Math.max(.12,Math.pow(e,.65));
    }
    return base*m/2;
  };
  const L=[],R=[];
  for(let i=0;i<n;i++){
    const a=pts[(i-1+n)%n], b=pts[(i+1)%n];
    let dx=b[0]-a[0], dy=b[1]-a[1];
    const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const hw=wAt(i);
    L.push([pts[i][0]-dy*hw, pts[i][1]+dx*hw]);
    R.push([pts[i][0]+dy*hw, pts[i][1]-dx*hw]);
  }
  const f=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  let d='M'+f(L[0]);
  for(let i=1;i<n;i++)d+='L'+f(L[i]);
  if(closed)d+='Z M'+f(R[0]); else d+='L'+f(R[n-1]);
  for(let i=n-2;i>=0;i--)d+='L'+f(R[i]);
  d+='Z';
  return d;
}

function inkRectPath(w,h,seed,base,slack){
  return brush(rectPoints(w,h,seed,slack),true,base||2.4,seed);
}
function inkLinePath(w,seed,base,amp){
  return brush(linePoints(w,seed,amp),false,base||2.6,seed);
}

function inkBox(el,seed){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','line');svg.setAttribute('preserveAspectRatio','none');
  el.appendChild(svg);
  const draw=()=>{
    const w=el.clientWidth,h=el.clientHeight;
    if(!w||!h)return;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    let inner='';
    if(el.classList.contains('us')){
      inner=`<path class="second" d="${inkRectPath(w-7,h-7,seed+91,1.25)}" transform="translate(3.5,3.5)"/>`;
    }
    svg.innerHTML=`<path d="${inkRectPath(w,h,seed,el.classList.contains('empty')?1.7:2.2)}"/>`+inner;
  };
  draw();
  if(window.ResizeObserver)new ResizeObserver(draw).observe(el);
  return draw;
}

function inkRule(el,seed){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.appendChild(svg);
  const draw=()=>{const w=el.clientWidth;if(!w)return;
    svg.setAttribute('viewBox',`0 0 ${w} 14`);
    svg.innerHTML=`<path d="${inkLinePath(w,seed,1.9)}"/>`;};
  draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(el);
}

/* ══════════════════════════════════════════
   水彩暈染
   ══════════════════════════════════════════ */
function washDefs(){
  if(document.getElementById('ink-defs'))return;
  const d=document.createElement('div');
  d.innerHTML=`<svg id="ink-defs" width="0" height="0" aria-hidden="true"
    style="position:absolute;pointer-events:none">
    <defs>
      <filter id="wash1" x="-40%" y="-40%" width="180%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="2.6"/>
      </filter>
      <filter id="mist" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="4" seed="13">
          <animate attributeName="baseFrequency" dur="7s"
            values="0.018 0.03;0.026 0.021;0.018 0.03" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="" scale="26"/>
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <filter id="wash2" x="-40%" y="-40%" width="180%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="2"/>
      </filter>
    </defs></svg>`;
  document.body.appendChild(d.firstElementChild);
}

/** 一團暈開的顏色。放在文字或框的後面。 */
function wash(w,h,color,op,f){
  const cls=(w>=300)?'wash page':'wash';
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <ellipse cx="${w/2}" cy="${h/2}" rx="${w*0.36}" ry="${h*0.34}"
      fill="${color}" opacity="${op}" filter="url(#${f||'wash1'})"/></svg>`;
}

/* ══════════════════════════════════════════
   小插圖（原創，不是那本書裡的角色）
   ══════════════════════════════════════════ */
/* 把折線加密，筆刷才畫得出輪廓而不是塗成一塊 */
function densify(pts,closed,per){
  const n=pts.length,out=[],m=closed?n:n-1,k=per||9;
  for(let i=0;i<m;i++){
    const a=pts[i],b=pts[(i+1)%n];
    for(let j=0;j<k;j++){
      const t=j/k;out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]);
    }
  }
  if(!closed)out.push(pts[n-1]);
  return out;
}

function vignette(kind){
  const P=[];
  const add=(pts,closed,base,seed)=>
    P.push(`<path d="${brush(densify(pts,closed),closed,base,seed)}"/>`);
  const arc=(cx,cy,r,a0,a1,n)=>{const o=[];for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return o;};

  if(kind==='hut'){
    add([[18,62],[18,40],[52,22],[86,40],[86,62]],false,2.6,11);   // 屋身與屋頂
    add([[14,62],[90,62]],false,2.2,23);                           // 地
    P.push(`<path d="${brush(rectPoints(16,14,41,1.4).map(p=>[p[0]+44,p[1]+41]),true,1.5,41)}"/>`);
    P.push(`<circle cx="52" cy="47" r="9" fill="var(--ochre)" opacity=".2"/>`); // 窗裡的光
  }
  if(kind==='cup'){
    add([[26,44],[28,72],[34,78],[62,78],[68,72],[70,44]],false,2.6,17); // 杯身
    add([[22,44],[74,44]],false,2.2,29);                                 // 杯口
    P.push(`<path d="${brush(arc(72,56,10,-1.25,1.25,18),false,1.9,53)}"/>`);
    add([[42,34],[46,26],[42,18]],false,1.7,61);                         // 熱氣
    add([[54,34],[58,26],[54,18]],false,1.7,71);
  }
  if(kind==='boat'){
    add([[18,56],[30,70],[70,70],[82,56]],false,2.2,13);   // 船身
    add([[18,56],[82,56]],false,1.8,83);                   // 船緣
    add([[50,56],[50,20]],false,1.9,37);                   // 桅
    add([[52,22],[74,50],[52,50]],false,1.7,47);           // 帆
    add([[8,82],[30,78],[54,82],[96,78]],false,1.6,59);    // 水
  }
  if(kind==='stones'){
    P.push(`<path d="${brush(arc(38,64,18,Math.PI,2*Math.PI,26).concat([[56,66],[20,66]]),true,2,19)}"/>`);
    P.push(`<path d="${brush(arc(71,68,12,Math.PI,2*Math.PI,20).concat([[83,70],[59,70]]),true,1.8,31)}"/>`);
    add([[6,74],[98,72]],false,1.6,43);
  }
  return `<svg class="vig" viewBox="0 0 104 92" aria-hidden="true">${P.join('')}</svg>`;
}

/* ══════════════════════════════════════════
   API
   ══════════════════════════════════════════ */
/* 版本標記。設定面板最下面會顯示，用來確認手機上跑的是哪一版。 */
const BUILD='2026-10-16 · 照片留言';

const LS={url:'jo.url',token:'jo.token',seen:'jo.welcomed',fgSys:'jo.fgSystem'};
const BAKED=(typeof API_URL!=='undefined'&&API_URL)?API_URL:'';
const S={url:BAKED||localStorage.getItem(LS.url)||'',token:localStorage.getItem(LS.token)||'',
  user:'',partner:'',copy:{},settings:{},stamps:[],stampSets:{},pending:[],
  view:null,tab:'month',imgCache:{},qfilter:'',ym:null,months:[],unseen:[],justRevealed:null,
  qopen:{},projects:[],pid:null,proj:null,pcat:'',ncat:'',pwho:'',thumbCache:{}};

/**
 * 送一個請求出去，並且在回來的東西不是 JSON 時說清楚為什麼。
 * 「連不上」是最沒用的錯誤訊息 —— 它把唯一的線索吞掉了。
 */
async function post(url,body){
  let res;
  try{
    res=await fetch(url,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  }catch(e){
    throw new Error('連不到伺服器（網路不通，或網址錯了）');
  }
  const txt=await res.text();
  try{
    return JSON.parse(txt);
  }catch(e){
    // Apps Script 出錯時回的是 HTML，不是 JSON
    const low=txt.toLowerCase();
    if(low.indexOf('accounts.google.com')>=0||low.indexOf('signin')>=0
      ||low.indexOf('sign in')>=0||low.indexOf('登入')>=0){
      throw new Error('後端要求登入 Google —— 部署設定裡「誰可以存取」要選「所有人」，改完要重新部署');
    }
    if(low.indexOf('script function not found')>=0||low.indexOf('找不到指令碼函式')>=0){
      throw new Error('後端沒有 doPost —— Code.gs 可能沒貼完整');
    }
    if(low.indexOf('authorization')>=0||low.indexOf('授權')>=0){
      throw new Error('後端需要重新授權 —— 到 Apps Script 手動執行一次 diagnose 並允許');
    }
    if(res.status>=400){
      throw new Error('後端回了 HTTP '+res.status+'：'+txt.replace(/<[^>]*>/g,' ').trim().slice(0,90));
    }
    throw new Error('後端回的不是 JSON：'+txt.replace(/<[^>]*>/g,' ').trim().slice(0,90));
  }
}

async function api(action,payload){
  const j=await post(S.url,Object.assign({action,token:S.token},payload||{}));
  if(!j.ok)throw new Error(j.error||'出了點狀況');
  return j.data;
}

/* 語氣表。找不到就回代號，這樣缺字會很明顯，不會默默消失。 */
/**
 * 試算表裡有就用，沒有就用寫在程式裡的那句。
 * 這樣即使還沒跑 setup，畫面也不會冒出一堆代號。
 */
function tf(key,fallback,vars){
  if(S.copy[key]===undefined){
    let x=fallback;
    if(vars)for(const k in vars)x=String(x).split('{'+k+'}').join(vars[k]);
    return x;
  }
  return t(key,vars);
}

/** 有專屬的說法就用專屬的，沒有就退回通用的。 */
function tk(base,kind,vars){
  const special=base+'.'+kind;
  return (S.copy[special]!==undefined)?t(special,vars):t(base,vars);
}
function t(key,vars){
  let s=S.copy[key]!==undefined?S.copy[key]:key;
  if(vars)for(const k in vars)s=s.split('{'+k+'}').join(vars[k]);
  return s;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════════════════════════════════
   網址

   試算表裡存的永遠是純文字，這裡只是「讀的時候看起來像連結」。
   十年後打開試算表，看到的還是你當初貼的那一串。

   只認 http/https 開頭的，所以 javascript: 之類的東西進不來。
   一定要在跳脫「之前」切開，不然 & 已經變成 &amp;，網址會被剪斷。
   ══════════════════════════════════════════ */
/* 網址不吃全形標點。
   「https://news.com/文章。真的很棒」如果只用 [^\s]，句號後面整串都會被當成網址。
   漢字本身留著 —— 有些網址真的長那樣，砍掉會變成指到別的頁面，那比連不到更糟。 */
const URL_RE=/https?:\/\/[^\s\u3000-\u303F\uFF00-\uFFEF]+/g;

/** 把黏在網址尾巴的標點還給句子 */
function trimUrl(u){
  let s=u.replace(/[.,;:!?'"`、。，；：！？…～]+$/,'');
  const PAIR={')':'(',']':'[','}':'{','）':'（','】':'【','》':'《','」':'「','』':'『'};
  while(s.length){
    const last=s.slice(-1),open=PAIR[last];
    if(!open)break;
    // 網址裡本來就有成對括號的（維基百科那種）要留著
    const opens=s.split(open).length-1,closes=s.split(last).length-1;
    if(closes>opens)s=s.slice(0,-1);else break;
  }
  return s;
}

/** 內文裡顯示的短版：網域＋一小截路徑 */
function shortUrl(u,max){
  const cut=max||18;
  try{
    const x=new URL(u);
    const host=x.hostname.replace(/^www\./,'');
    let tail=(x.pathname||'').replace(/\/+$/,'')+(x.search||'');
    try{tail=decodeURIComponent(tail);}catch(e){}
    if(tail.length>cut)tail=tail.slice(0,cut-1)+'…';
    return host+tail;
  }catch(e){
    return u.length>cut+12?u.slice(0,cut+11)+'…':u;
  }
}

/**
 * 按鈕上只放網域。
 * 內文已經有一次短網址了，按鈕再放一次會像同一句話講兩遍 ——
 * 按鈕要回答的是「這會把我帶去哪裡」，不是「網址長什麼樣」。
 */
function urlHost(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }
  catch(e){ return shortUrl(u,10); }
}

/** 一段文字裡所有的網址，去重，照出現順序 */
function urlsIn(text){
  const out=[],seen={};
  URL_RE.lastIndex=0;
  let m;
  while((m=URL_RE.exec(String(text||'')))){
    const u=trimUrl(m[0]);
    if(u&&!seen[u]){seen[u]=1;out.push(u);}
  }
  return out;
}

/** 內文：網址就地變成可點的，其餘照舊跳脫 */
function richText(text){
  const s=String(text==null?'':text);
  let out='',last=0,m;
  URL_RE.lastIndex=0;
  while((m=URL_RE.exec(s))){
    const u=trimUrl(m[0]);
    if(!u){continue;}
    out+=esc(s.slice(last,m.index));
    out+=`<a class="ln" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(u))}</a>`;
    last=m.index+u.length;
  }
  out+=esc(s.slice(last));
  return out;
}

/** 內文下面長出來的那一排按鈕 */
function linkRow(text){
  const list=urlsIn(text);
  if(!list.length)return '';
  // 同一則裡有兩個同網域的連結，光看網域分不出來，那就補上路徑
  const seen={};
  list.forEach(u=>{const h=urlHost(u);seen[h]=(seen[h]||0)+1;});
  return `<div class="links">${list.map(u=>{
    const h=urlHost(u);
    const label=seen[h]>1?shortUrl(u,14):h;
    return `<a class="btn link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">
      <svg preserveAspectRatio="none"></svg>
      <span>${esc(label)}</span></a>`;
  }).join('')}</div>`;
}

function btn(label,cls,attrs){
  return `<button class="btn ${cls||''}" ${attrs||''}>
    <svg preserveAspectRatio="none" viewBox="0 0 100 46"><path d="${inkRectPath(100,46,hash(label),2.1,2.2)}"/></svg>
    <span>${esc(label)}</span></button>`;
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function paintFields(root){
  (root||document).querySelectorAll('.field').forEach((f,i)=>{
    let svg=f.querySelector('svg');
    if(!svg){
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('preserveAspectRatio','none');
      f.appendChild(svg);
    }
    const draw=()=>{const w=f.clientWidth,h=f.clientHeight;if(!w||!h)return;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.innerHTML=`<path d="${inkLinePath(w,hash(f.textContent+i)+i,1.9,1.6)}" transform="translate(0,${h-9})"/>`;};
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(f);
  });
}
function paintButtons(root){
  (root||document).querySelectorAll('.door svg').forEach(svg=>{
    const b=svg.parentElement;
    const draw=()=>{const w=b.clientWidth,h=b.clientHeight;if(!w||!h)return;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.innerHTML=`<path d="${inkRectPath(w-4,h-4,hash(b.textContent),1.7,3)}" transform="translate(2,2)"/>`;};
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(b);
  });
  (root||document).querySelectorAll('.btn:not(.plain):not(.door) svg').forEach(svg=>{
    const b=svg.parentElement;
    const draw=()=>{const w=b.clientWidth,h=b.clientHeight;if(!w||!h)return;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      svg.innerHTML=`<path d="${inkRectPath(w-4,h-4,hash(b.textContent),2.1,2.2)}" transform="translate(2,2)"/>`;};
    draw();if(window.ResizeObserver)new ResizeObserver(draw).observe(b);
  });
}

    網址在 Apps Script 的「部署 → 管理部署作業」裡，結尾是 /exec 的那一個。</p>
  </div>`;
  paintFields();paintButtons();
  const inp=document.getElementById('u'),e=document.getElementById('e');
  setTimeout(()=>inp.focus(),100);

  const go=async()=>{
    let v=inp.value.replace(/[\s'"`<>]/g,'').replace(/\/+$/,'');
    if(!v){e.textContent='還沒貼上網址';inp.focus();return;}
    if(v.indexOf('script.google.com')<0){
      e.textContent='這不像 Apps Script 的網址，它應該是 script.google.com 開頭';return;}
    if(/\/dev$/.test(v)){
      e.textContent='這是測試用的網址。要用「部署」拿到的那個，結尾是 /exec';return;}
    if(!/\/exec$/.test(v)){
      e.textContent='網址結尾應該是 /exec';return;}
    if(v.indexOf('https://')!==0)v='https://'+v.replace(/^https?:\/\//,'');

    e.innerHTML='試試看能不能通 <span class="spin"></span>';
    try{
      const j=await post(v,{action:'login',code:'__probe__'});
      if(typeof j.ok==='undefined')throw new Error('回來的東西不對');
      S.url=v;localStorage.setItem(LS.url,v);screenLogin();
    }catch(err){ e.textContent=err.message; }
  };
  document.getElementById('go').onclick=go;
  inp.onkeydown=ev=>{if(ev.key==='Enter')go()};

}

function monthLabel(ym){
  const names=tf('month.names','一,二,三,四,五,六,七,八,九,十,十一,十二').split(',');
  const [y,m]=ym.split('-');
  const nm=(names[Number(m)-1]||m).trim();
  return {y, m:tf('month.format','{m}月',{m:nm})};
}

function frameHTML(kind,i,photo,opts){
  const o=opts||{};
  const shape=kind==='us'?'wide':(kind==='me'?'tall':'sq');
  const cls=['frame',shape,kind==='us'?'us':'',photo?'':'empty',
    o.covered?'covered':'',o.willful?'willful':''].join(' ');
  const seed=hash(kind+i+(o.ns||''));
  const inner=photo
    ? `<img data-pid="${esc(photo.id)}" alt="">${photo.isLate?`<span class="tag">${esc(t('late.badge'))}</span>`:''}${photo.isWillful?`<span class="tag mark">任性</span>`:''}`
    : (o.covered?`<div class="cover"></div>`
      : o.willful?`<div class="slot"><em>＋</em>${esc(t('willful.confirm'))}</div>`
      : `<div class="slot">＋</div>`);
  const addable=!photo&&!o.covered&&!o.readonly;
  const delay=(o.delay!==undefined)?` style="animation-delay:${(o.delay*0.09).toFixed(2)}s"`:'';
  return `<div class="${cls}" data-seed="${seed}" data-kind="${kind}"${delay}
    ${addable?`data-add="${kind}" tabindex="0" role="button"`:''}
    ${photo?'tabindex="0" role="button"':''}>${inner}</div>`;
}

/** 月份加減。回傳 yyyy-MM。 */
function shiftYm(ym,d){
  const p=ym.split('-'); const dt=new Date(Number(p[0]),Number(p[1])-1+d,1);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
}

function renderMonth(){
  const v=S.view,q=v.quota,c=v.counts;
  const {y,m}=monthLabel(v.yearMonth);
  const list=(S.months&&S.months.length)?S.months:[v.yearMonth];
  const earliest=list[0], nowYm=list[list.length-1];
  const prevYm=(v.yearMonth>earliest)?shiftYm(v.yearMonth,-1):null;
  const nextYm=(v.yearMonth<nowYm)?shiftYm(v.yearMonth,1):null;

      ? `<div class="grid self${q.self>=7?' dense':''}">${Array.from({length:n},(_,i)=>frameHTML('self',i,null,{covered:true,ns:'c'})).join('')}</div>
         <p class="cap sys">${esc(t('reveal.waiting',{n}))}　${esc(when)}</p>`

  const left=(q.self-c.self)+(q.us-c.us);
  return `<div class="sheet">
    ${wash(300,210,'#D9A05B',0.13,'wash1')}
    <div class="head">
      <div class="ymwrap">
        <button class="step" id="prevm" ${prevYm?'':'disabled'}>‹</button>
        <h1 class="ym">${esc(y)} · ${esc(m)}</h1>
        <button class="step" id="nextm" ${nextYm?'':'disabled'}>›</button>
        ${past?`<button class="backnow" id="nowm">回這個月</button>`:''}

    ${(!past&&(S.projects||[]).length)?`<div class="pcards">${S.projects.map(p=>
      `<button class="btn door pcard" data-proj="${esc(p.id)}"><svg preserveAspectRatio="none"></svg>
        <span><b>${esc(p.name)}</b>${pRange(p)?`<em>${esc(pRange(p))}</em>`:''}<i>›</i></span></button>`).join('')}</div>`:''}

    <div class="rule" id="r1"></div>

    <section class="group">

/** 哪一種東西能蓋哪些章 */
function stampsFor(targetType,target){
  const sets=S.stampSets||{};
  if(targetType==='photo'&&target.kind==='me'&&sets.me)return sets.me;
  return sets['default']||S.stamps||[];
}

function stampRow(targetType,target){
  const list=target.stamps||[];
  const mine=list.filter(x=>x.from===S.user)[0];
  const theirs=list.filter(x=>x.from!==S.user)[0];
  // 印章是回應對方，不是回應自己。自己的東西只顯示收到了什麼。
  if(target.owner===S.user){
    return theirs?`<div class="stamps${stampsFor(targetType,target).length===1?' solo':''}"><span class="st theirs">${esc(S.partner)}：${esc(labelOf(theirs.code))}</span></div>`:'';
  }
  const chips=stampsFor(targetType,target).map(st=>
    `<button class="st ${mine&&mine.code===st.code?'mine':''}"
      data-stamp="${st.code}" data-tt="${targetType}" data-ti="${esc(target.id)}">${esc(st.label)}</button>`).join('');
  const solo=stampsFor(targetType,target).length===1?' solo':'';
  return `<div class="stamps${solo}">${chips}</div>`;
}
function labelOf(code){
  const all=[].concat(S.stamps||[]);
  const sets=S.stampSets||{};
  Object.keys(sets).forEach(k=>[].push.apply(all,sets[k]));
  const f=all.filter(x=>x.code===code)[0];return f?f.label:code;
}
function bindStamps(root){
  (root||document).querySelectorAll('[data-stamp]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{
      const r=await api('stamp',{targetType:b.dataset.tt,targetId:b.dataset.ti,stampCode:b.dataset.stamp});
      const box=[].concat(S.quotes||[],S.view?S.view.mine:[],S.view?S.view.theirs:[],
        S.proj&&S.proj.photos?S.proj.photos:[],S.proj&&S.proj.notes?S.proj.notes:[]);
      const item=box.filter(x=>x.id===b.dataset.ti)[0];
      if(item)item.stamps=r.stamps;
      const wrap=b.closest('.stamps');
      if(wrap&&item){wrap.outerHTML=stampRow(b.dataset.tt,item);bindStamps(wrap.parentElement||document);}
    }catch(e){b.disabled=false;}
  });
}

      ${stampRow('quote',q)}
    </article>`;

  // 按月份分組。最新的那個月打開，其他收起來 ——
  // 不然每多一則，寫字的門就被往下推一格
  const months=[],byYm={};
  list.forEach(q=>{
    const ym=String(q.createdAt||'').slice(0,7)||'—';
    if(!byYm[ym]){byYm[ym]=[];months.push(ym);}
    byYm[ym].push(q);
  });
  const body=list.length?months.map((ym,i)=>{
    const open=(ym in S.qopen)?S.qopen[ym]:(i===0);
    const lab=/^\d{4}-\d{2}$/.test(ym)?(()=>{const {y,m}=monthLabel(ym);return y+' · '+m;})():ym;
    return `<div class="qmonth">
      <button class="qm-h ${open?'on':''}" data-qm="${esc(ym)}">
        <span class="mm">${esc(lab)}</span><span class="n">${byYm[ym].length}</span>
        <span class="go">${open?'－':'＋'}</span></button>
      ${open?byYm[ym].map(article).join(''):''}</div>`;
  }).join('')
    : `<div class="vig-wrap">${vignette('cup')}<p class="cap">${esc(t('quote.empty'))}</p></div>`;

  const door=(k,cls)=>`<button class="btn door ${cls||''}" data-door="${k}">
    <svg preserveAspectRatio="none"></svg>
    <span>${esc(t('quote.door.'+k,{who:S.partner}))}</span></button>`;

  const asks=(S.pending||[]).map(p=>`
    <div class="tossed" data-toss="${esc(p.id)}">
      <svg preserveAspectRatio="none"></svg>
      <div class="who">${esc(t('toss.title',{who:p.from}))}</div>
      <div class="qq">${esc(p.prompt)}</div>
      <div class="acts">
        <button class="btn plain" data-ans="${esc(p.id)}"><span>${esc(t('toss.answer'))}</span></button>
        <button class="btn plain" data-drop="${esc(p.id)}"><span>${esc(t('toss.drop'))}</span></button>
      </div>
    </div>`).join('');

  return `<div class="sheet">
    ${wash(300,210,'#D9A05B',0.12,'wash2')}
    <div class="head"><h1 class="ym">${esc(t('quote.title'))}</h1>
      <span class="led">${all.length}</span></div>
    <div class="rule" id="r1"></div>
    <div class="doors top">${door('quote')}${door('note')}${door('say','say')}${door('ask','ask')}</div>
    ${asks}
    ${filters}
    ${body}
  </div>`;
}

/**
 * kind: 'quote' 聽到的一句話｜'note' 想到的一件事｜'ask' 抽到的一題
 * existing 有值時是修改。
 */
function panelQuote(kind,existing,existingToss){
  const k=existing?(existing.kind||'quote'):(kind||'quote');
  const ph=tk('quote.placeholder',k);   // 找不到專屬的就退回通用的
  const askBlock=(k==='ask'&&!existing)?`
    <div class="slip" id="slip">
      <div class="glow"></div>${mistSVG()}
      <svg class="frame" preserveAspectRatio="none"></svg>
      <div class="q" id="qq">　</div></div>
    <div class="field hide" id="ownwrap" style="margin-top:10px">
      <input id="ownq" placeholder="${esc(t('quote.ask.ownHint'))}"></div>
    <p class="cap sys" style="margin:2px 0 0;text-align:center" id="askhint">${esc(t('quote.ask.hint'))}</p>
    <div style="display:flex;justify-content:center;gap:10px;margin-top:10px">
      ${btn(t('quote.ask.again'),'','id="again"')}${btn(t('quote.ask.own'),'','id="own"')}</div>`:'';
  const askTag=(k==='ask'&&existing&&existing.prompt)
    ? `<p class="q-tag">${esc(existing.prompt)}</p>`:'';

  const v=panel(`
    <h3>${esc(existing?t('edit.title'):t('quote.door.'+k,{who:S.partner}))}</h3>
    ${askBlock}${askTag}
    <div class="field" style="margin-top:${k==='ask'?'16':'8'}px">
      <textarea id="qt" rows="3" placeholder="${esc(ph)}">${esc(existing?existing.text:'')}</textarea></div>
    ${(k==='quote')?`<div class="field" style="margin-top:14px">
        <input id="qs" placeholder="${esc(t('quote.source'))}"
          value="${esc(existing?(existing.source||''):'')}"></div>`:''}
    ${existing?`<p class="note">${esc(t('edit.notice'))}</p>`:''}
    <div class="err" id="e"></div>
    <div class="row">${(k==='ask'&&!existing)?'':btn(tf('ui.cancel','先不要'),'','id="no"')}
      ${(k==='ask'&&!existing)?btn(t('quote.ask.toss'),'','id="toss"'):''}
      ${btn((k==='ask'&&!existing)?t('quote.ask.mine'):tf('ui.record','記下來'),'warm','id="ok"')}</div>`);

  let drawn='', own=false;
  if(k==='ask'&&!existing){
    const slip=v.querySelector('#slip'), qq=v.querySelector('#qq');
    const ownwrap=v.querySelector('#ownwrap'), ownq=v.querySelector('#ownq');
    const hint=v.querySelector('#askhint'), again=v.querySelector('#again');
    inkSlip(slip);

    const roll=()=>{
      const pool=askPool();
      if(!pool.length){qq.textContent=tf('err.emptyPool','題庫是空的');return;}
      slip.classList.remove('landed');
      slip.classList.add('rolling');
      let n=0;
      const iv=setInterval(()=>{
        qq.textContent=pool[Math.floor(Math.random()*pool.length)];
        if(++n>=16){
          clearInterval(iv);
          drawn=pool[Math.floor(Math.random()*pool.length)];
          qq.textContent=drawn;
          slip.classList.remove('rolling');
          slip.classList.add('landed');   // 霧退去，字浮現
        }
      },58);
    };
    roll();
    again.onclick=roll;

    // 自己出題 —— 跟抽題其實是同一件事，差別只在題目哪裡來的
    v.querySelector('#own').onclick=()=>{
      own=!own;
      slip.classList.toggle('hide',own);
      again.classList.toggle('hide',own);
      ownwrap.classList.toggle('hide',!own);
      hint.textContent=own?t('quote.ask.ownHint'):t('quote.ask.hint');
      if(own)setTimeout(()=>ownq.focus(),60);
      paintFields(v);
    };

    v.querySelector('#toss').onclick=async()=>{
      const q=own?ownq.value.trim():drawn;
      if(!q){v.querySelector('#e').textContent=tf('err.noPrompt','還沒有題目');return;}
      const tb=v.querySelector('#toss');tb.disabled=true;
      v.querySelector('#e').innerHTML='<span class="spin"></span>';
      try{
        await api('toss',{prompt:q,origin:own?'own':'draw'});
        v.remove();toast(t('app.name'),t('toss.sent'));
      }catch(e){tb.disabled=false;v.querySelector('#e').textContent=e.message;}
    };
  }

  const noBtn=v.querySelector('#no');
  if(noBtn)noBtn.onclick=()=>v.remove();
  v.querySelector('#ok').onclick=async()=>{
    const text=v.querySelector('#qt').value.trim();
    if(!text){v.querySelector('#e').textContent=tf('err.empty','還沒寫東西');return;}
    const ok=v.querySelector('#ok');ok.disabled=true;
    v.querySelector('#e').innerHTML='<span class="spin"></span>';
    try{
      if(existing){
        const src=v.querySelector('#qs');
        await api('updateQuote',{id:existing.id,text,
          source:src?src.value.trim():undefined});
      }
      else{
        const src=v.querySelector('#qs');
        const ownq=v.querySelector('#ownq');
        const p=(k==='ask')?(own&&ownq?ownq.value.trim():drawn):'';
        await api('addQuote',{kind:k,text,
          source:src?src.value.trim():'', prompt:p, tossId:existingToss});
      }
      v.remove();S.quotes=await api('listQuotes',{limit:100000});render();
    }catch(e){ok.disabled=false;v.querySelector('#e').textContent=e.message;}
  };
}

}

/* ══════════════════════════════════════════
   任性罐
   ══════════════════════════════════════════ */
/* 罐子的輪廓。用筆刷畫，所以是一圈粗細不勻的墨線，不是實心色塊。 */
/* ══════════════════════════════════════════
   任性罐
   罐子的高度由容量決定，彈珠用金字塔堆疊。
   五顆的罐子就該是五顆的大小。
   ══════════════════════════════════════════ */

/* 每顆彈珠：底色、紋路、亮部 */
const MARBLE=[
  {b:'#C98A3C',s:'#E8C07A',t:'#8E5A18'},   // 琥珀
  {b:'#8B9B72',s:'#B8C79A',t:'#5C6B45'},   // 苔
  {b:'#7A93A3',s:'#AFC6D2',t:'#4C6675'},   // 灰藍
  {b:'#B5703C',s:'#DDA070',t:'#7A4520'},   // 赭
  {b:'#C9A961',s:'#EBD69C',t:'#8F7333'},   // 蜜
  {b:'#9E8468',s:'#C8B199',t:'#6B5540'},   // 灰褐
  {b:'#A8737A',s:'#D2A3A8',t:'#734A50'},   // 乾玫瑰
  {b:'#6F8C86',s:'#A3BEB8',t:'#47605B'}    // 灰青
];

/** 金字塔堆疊：底層 b 顆，往上每層少一顆，剛好裝滿容量 */
function pileRows(cap){
  let b=1; while(b*(b+1)/2<cap)b++;
  const rows=[];let left=cap;
  for(let n=b;n>0&&left>0;n--){const k=Math.min(n,left);rows.push(k);left-=k;}
  return rows;                      // [底層, ..., 頂層]
}

function jarPath(w,h,seed){
  const r=rng(seed),j=k=>(r()-.5)*k;
  const nx=w*0.34,nw=w*0.32;
  const pts=[
    [nx+j(2),      h*0.05],
    [nx+j(2),      h*0.13],
    [w*0.14+j(2),  h*0.20],
    [w*0.075+j(2), h*0.33],
    [w*0.06+j(2),  h*0.50],
    [w*0.06+j(2),  h*0.86],
    [w*0.11+j(2),  h*0.95],
    [w*0.26+j(2),  h*0.975],
    [w*0.74+j(2),  h*0.975],
    [w*0.89+j(2),  h*0.95],
    [w*0.94+j(2),  h*0.86],
    [w*0.94+j(2),  h*0.50],
    [w*0.925+j(2), h*0.33],
    [w*0.86+j(2),  h*0.20],
    [nx+nw+j(2),   h*0.13],
    [nx+nw+j(2),   h*0.05]
  ];
  return brush(densify(pts,true,7),true,w>110?2.2:1.6,seed);
}

function jarSVG(count,capacity,seed,w){
  w=w||186;
  const cap=Math.max(1,capacity||5);
  const rows=pileRows(cap);
  const base=rows[0];

  // 彈珠大小由底層決定，讓最寬那排剛好貼著瓶壁
  const inner=w*0.72;
  const rad=Math.min(inner/(2*base), w*0.155);
  const dy=rad*1.68;                       // 上下層咬合的高度
  const pileH=rad*2+(rows.length-1)*dy;

  // 上方只留一點空氣。罐子的高度跟著堆疊走，不是固定的。
  const headroom=rad*1.15+w*0.04;
  const bodyH=pileH+headroom;
  const h=bodyH/0.79;                      // 瓶身（含頸）佔全高的比例
  const bottom=h*0.945;

  const r=rng(seed+17);
  let defs='',shadows='',balls='';
  let placed=0;

  for(let ri=0;ri<rows.length;ri++){
    const n=rows[ri];
    const y=bottom-rad-ri*dy;
    const startX=w/2-(n-1)*rad*2/2;
    for(let i=0;i<n;i++){
      const jx=(r()-.5)*rad*0.14, jy=(r()-.5)*rad*0.10;
      const cx=startX+i*rad*2+jx, cy=y+jy;
      const rr=rad*(0.93+r()*0.12);
      const filled=placed<count;

      if(filled){
        const m=MARBLE[(placed*3+ri)%MARBLE.length];
        const id='mb'+seed+'_'+placed;
        const ang=Math.round(r()*180);
        defs+=`<radialGradient id="${id}" cx="34%" cy="30%" r="72%">
          <stop offset="0%" stop-color="${m.s}"/>
          <stop offset="58%" stop-color="${m.b}"/>
          <stop offset="100%" stop-color="${m.t}"/></radialGradient>`;
        // 接觸陰影：讓它看起來是壓在下面那顆上
        shadows+=`<ellipse cx="${(cx+rr*0.12).toFixed(1)}" cy="${(cy+rr*0.86).toFixed(1)}"
          rx="${(rr*0.78).toFixed(1)}" ry="${(rr*0.22).toFixed(1)}"
          fill="#2B2724" opacity=".16"/>`;
        balls+=`<g>
          <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}"
            fill="url(#${id})" stroke="rgba(43,39,36,.28)" stroke-width="${(rr*0.055).toFixed(2)}"/>
          <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}"
            rx="${(rr*0.62).toFixed(1)}" ry="${(rr*0.2).toFixed(1)}"
            fill="${m.s}" opacity=".5"
            transform="rotate(${ang} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>
          <ellipse cx="${(cx-rr*0.34).toFixed(1)}" cy="${(cy-rr*0.4).toFixed(1)}"
            rx="${(rr*0.3).toFixed(1)}" ry="${(rr*0.19).toFixed(1)}"
            fill="#fff" opacity=".62"
            transform="rotate(-28 ${(cx-rr*0.34).toFixed(1)} ${(cy-rr*0.4).toFixed(1)})"/>
        </g>`;
      }else{
        balls+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad*0.9).toFixed(1)}"
          fill="none" stroke="rgba(43,39,36,.14)" stroke-width="1" stroke-dasharray="3 4"/>`;
      }
      placed++;
    }
  }

  const lidY=h*0.045;
  return `<svg viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" role="img"
    aria-label="任性罐，${count} 顆，共 ${cap} 格">
    <defs>${defs}</defs>
    <ellipse cx="${w/2}" cy="${(h*0.985).toFixed(1)}" rx="${(w*0.40).toFixed(1)}"
      ry="${(h*0.022).toFixed(1)}" fill="#2B2724" opacity=".10"/>
    ${shadows}${balls}
    <path class="glass" d="${brush([[w*0.29,lidY],[w*0.71,lidY]],false,w>110?2.3:1.7,seed+5)}"/>
    <path class="glass" d="${jarPath(w,h,seed)}"/>
    <rect x="${(w*0.145).toFixed(1)}" y="${(h*0.34).toFixed(1)}"
      width="${(w*0.05).toFixed(1)}" height="${(h*0.46).toFixed(1)}"
      rx="${(w*0.025).toFixed(1)}" fill="#fff" opacity=".36"/>
    <rect x="${(w*0.815).toFixed(1)}" y="${(h*0.40).toFixed(1)}"
      width="${(w*0.026).toFixed(1)}" height="${(h*0.30).toFixed(1)}"
      rx="${(w*0.013).toFixed(1)}" fill="#fff" opacity=".22"/>
  </svg>`;
}

/* 照片存進瀏覽器的快取，關掉再開也還在，不用再跟後端要一次。 */
async function photoStore(){
  if(!('caches' in window))return null;
  try{return await caches.open('junou-photos-v1');}catch(e){return null;}
}

async function getPhoto(id){
  if(S.imgCache[id])return S.imgCache[id];
  const store=await photoStore();
  if(store){
    try{
      const hit=await store.match('/photo/'+id);
      if(hit){const u=await hit.text();S.imgCache[id]=u;return u;}
    }catch(e){}
  }
  const d=await api('photoData',{id});
  const url='data:'+d.mimeType+';base64,'+d.dataBase64;
  S.imgCache[id]=url;
  if(store){try{await store.put('/photo/'+id,new Response(url));}catch(e){}}
  return url;
}

function paint(img,url){
  img.src=url;
  img.onload=()=>img.classList.add('in');
  if(img.complete)img.classList.add('in');
}

async function loadImages(){
  const imgs=[...document.querySelectorAll('.frame img[data-pid]')];
  const store=await photoStore();
  const missing=[];

  // 先把快取裡有的畫出來
  for(const img of imgs){
    const id=img.dataset.pid;
    let url=S.imgCache[id];
    if(!url&&store){
      try{const hit=await store.match('/photo/'+id);if(hit){url=await hit.text();S.imgCache[id]=url;}}
      catch(e){}
    }
    if(url)paint(img,url); else missing.push(img);
  }
  if(!missing.length)return;

  // 剩下的一次要完。每通請求都是一次來回，七張打七通會很慢。
  for(let i=0;i<missing.length;i+=10){
    const chunk=missing.slice(i,i+10);
    try{
      const rows=await api('photoBatch',{ids:chunk.map(x=>x.dataset.pid)});
      const byId={};
      for(const r of rows){
        const url='data:'+r.mimeType+';base64,'+r.dataBase64;
        byId[r.id]=url;S.imgCache[r.id]=url;
        if(store){try{await store.put('/photo/'+r.id,new Response(url));}catch(e){}}
      }
      chunk.forEach(img=>{const u=byId[img.dataset.pid];if(u)paint(img,u);});
    }catch(e){/* 還沒揭曉或讀不到，就讓框空著 */}
  }
}

let pick={file:null,kind:'self',priv:false,dataUrl:''};

function openPicker(kind,priv){
  pick={file:null,kind:kind||'self',priv:!!priv,dataUrl:''};
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{
    if(!inp.files||!inp.files[0])return;
    const shrunk=await shrink(inp.files[0]);
    pick.dataUrl=shrunk.dataUrl;pick.b64=shrunk.b64;pick.mime=shrunk.mime;
    panelUpload();
  };
  inp.click();
}

/* 縮到長邊 1800，避免 base64 塞爆 Apps Script 的請求上限 */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1800,sc=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const url=cv.toDataURL('image/jpeg',.86);
        res({dataUrl:url,b64:url.split(',')[1],mime:'image/jpeg'});
      };
      img.onerror=rej;img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ══════════════════════════════════════════
   獨立專案

   旅行、重要的事。不算配額、不用等揭曉，放了就看得到。
   名稱、日期、分類全部在這裡改，不用碰試算表，也不用找人改程式。

   跟月份最大的不同：數量不設限。所以
   ・牆上只放縮圖，點開才載原圖（兩百張原圖一起進記憶體，手機會把 app 關掉）
   ・縮圖捲到才載
   ・一次可以選很多張，排隊上傳，三張同時傳
   ══════════════════════════════════════════ */
const PT=(k,fb,v)=>tf('proj.'+k,fb,v);
const PWASH=['#D9A05B','#A6BC84','#C89A86','#93B4C6'];

function visCats(list){return (list||[]).filter(c=>!c.hidden);}
function catName(list,id){const c=(list||[]).filter(x=>x.id===id)[0];return c?c.name:'';}
function pDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?`${+m[2]}/${+m[3]}`:'';}
function pRange(p){const a=pDate(p.startDate),b=pDate(p.endDate);return a&&b?`${a} – ${b}`:(a||b);}
function newCatId(){return 'c'+Math.random().toString(36).slice(2,12);}
/** 兩個人照名字排序，顏色固定 —— 不管在誰的手機上看，均均都是同一個顏色 */
function whoIdx(name){return [S.user,S.partner].sort().indexOf(name)===0?0:1;}
function whoTag(name,extra){return `<span class="wtag w${whoIdx(name)} ${extra||''}">${esc(name)}</span>`;}

async function openProject(id){

function saveProjectWith(P,patch){
  const body={id:P.id,name:P.name,note:P.note,startDate:P.startDate,endDate:P.endDate,
    photoCats:P.photoCats,noteCats:P.noteCats,coverPhotoId:P.coverPhotoId,status:P.status};

    };

    const wchip=(w,label,n)=>`<button class="chip ${S.pwho===w?'on':''}" data-pw="${esc(w)}">${label}<span class="n">${n}</span></button>`;
    const whoRow=allP.length?`<div class="filters">${wchip('',esc(PT('both','兩個人')),allP.length)}${

    photoSec=`<section class="psec">
      <div class="psec-h"><h2>${esc(PT('photos','照片'))}</h2>${btn(PT('addPhotos','＋ 放照片'),'warm small','id="padd"')}</div>
      ${queueBar()}

  const sub=[pRange(P),P.note].filter(Boolean).join('　');
  return `<div class="sheet proj">
    ${wash(300,210,'#93B4C6',0.12,'wash2')}
    ${back}

    <div class="rule" id="r1"></div>
    ${photoSec}${noteSec}
    ${(!pc.length&&!nc.length)?`<p class="cap">${esc(PT('noCats','還沒有分類。按「改這個專案」加幾個。'))}</p>`:''}
  </div>`;
}

/* ── 縮圖：捲到才載，十二張一批 ── */
let thumbIO=null,thumbBusy=false;
const thumbWant=new Set();
function watchThumbs(root){
  if(thumbIO)thumbIO.disconnect();
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);thumbWant.add(e.target.dataset.tid);}});
    pumpThumbs();
  },{rootMargin:'500px 0px'}):null;
  thumbIO=io;
  root.querySelectorAll('img[data-tid]').forEach(img=>{
    const id=img.dataset.tid;
    if(S.thumbCache[id]){paint(img,S.thumbCache[id]);return;}
    if(io)io.observe(img);else thumbWant.add(id);
  });
  if(!io)pumpThumbs();
}
function showThumb(id,u){
  document.querySelectorAll('img[data-tid]').forEach(img=>{if(img.dataset.tid===id)paint(img,u);});
}
async function pumpThumbs(){
  if(thumbBusy)return;thumbBusy=true;
  const store=await photoStore();
  try{
    while(thumbWant.size){
      const ids=[...thumbWant].slice(0,12);ids.forEach(i=>thumbWant.delete(i));
      const need=[];
      for(const id of ids){
        let u=null;
        if(store){try{const h=await store.match('/thumb/'+id);if(h)u=await h.text();}catch(e){}}
        if(u){S.thumbCache[id]=u;showThumb(id,u);}else need.push(id);
      }
      if(!need.length)continue;
      let rows=[];
      try{rows=await api('photoBatch',{ids:need,thumb:true});}catch(e){continue;}
      for(const r of rows){
        let u='data:'+r.mimeType+';base64,'+r.dataBase64;
        // 沒有縮圖的照片會拿到原圖，在這裡自己縮，不讓大圖留在記憶體
        if(r.dataBase64.length>160000){try{u=await downsize(u,420);}catch(e){}}
        S.thumbCache[r.id]=u;showThumb(r.id,u);
        if(store){try{await store.put('/thumb/'+r.id,new Response(u));}catch(e){}}
      }
    }
  }finally{thumbBusy=false;}
}
function downsize(url,max){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',.78));
    };
    img.onerror=rej;img.src=url;
  });
}
/** 原圖只在點開時載，存進快取但不留在記憶體 */
async function getFull(id){
  const store=await photoStore();
  if(store){try{const h=await store.match('/photo/'+id);if(h)return await h.text();}catch(e){}}
  const d=await api('photoData',{id});
  const u='data:'+d.mimeType+';base64,'+d.dataBase64;
  if(store){try{await store.put('/photo/'+id,new Response(u));}catch(e){}}
  return u;
}

/* ── 拍攝時間 ──
   縮圖用的 canvas 會把照片裡的資訊洗掉，所以要在縮之前，從原始檔讀出來。
   只讀 JPEG 的 EXIF；讀不到（例如 HEIC）就退回檔案時間。 */
async function takenAtOf(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();
    const d=exifDate(new DataView(buf));
    if(d)return d;
  }catch(e){}
  return localIso(new Date(file.lastModified||Date.now()));
}
function localIso(d){
  const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
function exifDate(dv){
  if(dv.getUint16(0)!==0xFFD8)return null;
  let off=2;
  while(off+4<dv.byteLength){
    const mk=dv.getUint16(off);
    if((mk&0xFF00)!==0xFF00)return null;
    if(mk===0xFFDA)return null;
    const len=dv.getUint16(off+2);
    if(mk===0xFFE1&&dv.getUint32(off+4)===0x45786966)return tiffDate(dv,off+10);
    off+=2+len;
  }
  return null;
}
function tiffDate(dv,t){
  const le=dv.getUint16(t)===0x4949;
  const u16=o=>dv.getUint16(t+o,le),u32=o=>dv.getUint32(t+o,le);
  const read=(ifd,want)=>{
    const out={},n=u16(ifd);
    for(let i=0;i<n;i++){
      const e=ifd+2+i*12,tag=u16(e);
      if(want.indexOf(tag)<0)continue;
      const type=u16(e+2),cnt=u32(e+4);
      if(type===2){
        const p=cnt>4?u32(e+8):e+8;let s='';
        for(let k=0;k<cnt-1;k++)s+=String.fromCharCode(dv.getUint8(t+p+k));
        out[tag]=s;
      }else out[tag]=u32(e+8);
    }
    return out;
  };
  const ifd0=read(u32(4),[0x8769,0x0132]);
  let s=null;
  if(ifd0[0x8769]){const ex=read(ifd0[0x8769],[0x9003,0x9004]);s=ex[0x9003]||ex[0x9004];}
  s=s||ifd0[0x0132];
  const m=/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(s||'');
  return m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`:null;
}

/** 一張照片做兩個尺寸：原圖 1800、縮圖 420。直接用檔案網址讀，不先轉成一大串文字 */
function prepare(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const at=max=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        return cv;
      };
      const b64=at(1800).toDataURL('image/jpeg',.86).split(',')[1];
      const tb64=at(420).toDataURL('image/jpeg',.78).split(',')[1];
      URL.revokeObjectURL(url);
      res({b64,tb64});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(PT('badImage','這張讀不出來')));};
    img.src=url;
  });
}

/* ── 上傳佇列 ── */
const Q={items:[],running:0,done:0,fail:[],total:0,pid:null,mine:[]};
let qTick=0,wakeLock=null;

function queueBar(){
  if(!Q.total||Q.pid!==S.pid)return '';
  const left=Q.total-Q.done-Q.fail.length;
  if(left>0)return `<div class="pqueue"><div class="bar"><i style="width:${Math.round(Q.done/Q.total*100)}%"></i></div>
    <p class="cap sys">${esc(PT('uploading','上傳中 {done} / {total}　請不要關掉 app',{done:Q.done,total:Q.total}))}</p></div>`;
  if(Q.fail.length)return `<div class="pqueue"><p class="cap sys">${esc(PT('failed','有 {n} 張沒傳上去',{n:Q.fail.length}))}</p>
    ${btn(PT('retry','再試一次'),'small','id="qretry"')}</div>`;
  if(Q.mine.length)return `<div class="pqueue"><p class="cap sys">${esc(PT('uploaded','傳好 {n} 張',{n:Q.mine.length}))}</p>
    <div class="qacts">${btn(PT('walk','一張一張補幾句'),'warm small','id="qwalk"')}${btn(PT('walkNo','不用了'),'small','id="qdone"')}</div></div>`;
  return '';
}
function enqueue(files,cat){
  if(Q.pid!==S.pid||Q.done+Q.fail.length>=Q.total){Q.items=[];Q.done=0;Q.fail=[];Q.total=0;Q.mine=[];}
  Q.pid=S.pid;
  files.forEach(f=>Q.items.push({file:f,cat,pid:S.pid,tries:0}));
  Q.total+=files.length;
  keepAwake(true);
  for(let i=Q.running;i<3;i++)worker();
  render();
}
function retryFailed(){
  const f=Q.fail.splice(0);
  f.forEach(it=>{it.tries=0;Q.items.push(it);});
  keepAwake(true);
  for(let i=Q.running;i<3;i++)worker();
  render();
}
async function worker(){
  Q.running++;
  try{
    while(Q.items.length){
      const it=Q.items.shift();
      try{await sendOne(it);Q.done++;}
      catch(e){it.tries++;it.err=e.message;if(it.tries<3)Q.items.push(it);else Q.fail.push(it);}
      softRender(false);
    }
  }finally{
    Q.running--;
    if(!Q.running){keepAwake(false);softRender(true);}
  }
}
async function sendOne(it){
  const takenAt=await takenAtOf(it.file);
  const img=await prepare(it.file);
  const r=await api('uploadPhoto',{projectId:it.pid,projectCat:it.cat,
    dataBase64:img.b64,mimeType:'image/jpeg',thumbBase64:img.tb64,takenAt});
  const u='data:image/jpeg;base64,'+img.tb64;
  S.thumbCache[r.photo.id]=u;
  const store=await photoStore();
  if(store){try{await store.put('/thumb/'+r.photo.id,new Response(u));}catch(e){}}
  if(S.proj&&S.proj.project&&S.proj.project.id===it.pid)S.proj.photos.push(r.photo);
  Q.mine.push(r.photo.id);
}
/** 進度條就地更新；每十二張、還有全部傳完時，才整頁重畫 */
function softRender(end){
  if(S.tab!=='proj')return;
  qTick++;
  if(end||qTick%12===0){render();return;}
  const el=document.querySelector('.pqueue');
  if(!el)return;
  const html=queueBar();
  if(!html){el.remove();return;}
  el.outerHTML=html;
  paintButtons();
  const rq=document.querySelector('#qretry');if(rq)rq.onclick=()=>retryFailed();
}
/** 傳的時候讓螢幕不要暗掉。支援的瀏覽器才有，不支援就算了 */
async function keepAwake(on){
  try{
    if(on&&!wakeLock&&navigator.wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{wakeLock=null;});
    }else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;}
  }catch(e){}
}

/* ── 面板：放照片 ── */
function panelProjectUpload(){
  const P=S.proj.project,cats=visCats(P.photoCats);
  let cat=(S.pcat&&cats.some(c=>c.id===S.pcat))?S.pcat:(cats[0]&&cats[0].id);
  const v=panel(`<h3>${esc(PT('uploadTitle','放照片'))}</h3>
    <p class="cap sys" style="margin:0">${esc(PT('uploadPickCat','先選分類，再一次選好幾張'))}</p>
    <div class="choices">${cats.map(c=>`<button class="chip ${c.id===cat?'on':''}" data-uc="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>
    <p class="note">${esc(PT('uploadNote','照片會照拍攝時間排好。傳的時候請不要關掉 app。'))}</p>
    <div class="row">${btn(tf('ui.close','關起來'),'','id="no"')}${btn(PT('pick','選照片'),'warm','id="ok"')}</div>`);
  v.querySelector('#no').onclick=()=>v.remove();
  v.querySelectorAll('[data-uc]').forEach(b=>b.onclick=()=>{
    cat=b.dataset.uc;v.querySelectorAll('[data-uc]').forEach(x=>x.classList.toggle('on',x.dataset.uc===cat));
  });
  v.querySelector('#ok').onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.multiple=true;
    inp.onchange=()=>{const fs=[...(inp.files||[])];if(!fs.length)return;v.remove();enqueue(fs,cat);};
    inp.click();
  };
}

  const P=S.proj.project,p=S.proj.photos.filter(x=>x.id===id)[0];if(!p)return;
  const mine=p.owner===S.user,cats=visCats(P.photoCats);
  let cat=p.projectCat,dirty=false;
  const isCover=P.coverPhotoId===id;
  const v=panel(`<img class="preview" id="pv" src="${S.thumbCache[id]||''}" alt="">
    <p class="cap sys pmeta">${whoTag(p.owner)}<span>${esc([catName(P.photoCats,p.projectCat),pDate(p.takenAt)].filter(Boolean).join('　'))}</span></p>
    ${mine?`<div class="field"><textarea id="cap" rows="2" placeholder="${esc(PT('captionHint','寫一點這張的事'))}">${esc(p.caption)}</textarea></div>
      <div class="capsave hide" id="capsave">${btn(tf('ui.save','存好'),'warm small','id="capok"')}</div>`
      :(p.caption?`<p class="cap pcap">${esc(p.caption)}</p>`:'')}
    ${stampRow('photo',p)}
    <p class="plabel">${esc(PT('replies','留言'))}</p>
    <div class="cmts" id="cmts"></div>
    <div class="cmt-new"><div class="field"><textarea id="cm" rows="1" placeholder="${esc(PT('replyHint','回一句'))}"></textarea></div>
      ${btn(PT('send','送出'),'small','id="cms"')}</div>
    <div class="err" id="e"></div>
    <div class="pacts">
      ${isCover?`<span class="cap sys" style="margin:0">${esc(PT('isCover','這張是封面'))}</span>`
        :`<button class="btn plain" id="cover"><span>${esc(PT('setCover','設成封面'))}</span></button>`}
      ${mine?`<button class="btn plain" id="more"><span>${esc(PT('more','換分類・刪除'))}</span></button>`:''}
    </div>
    ${mine?`<div id="morebox" class="hide">
      <div class="choices">${cats.map(c=>`<button class="chip ${c.id===cat?'on':''}" data-uc="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div>
      <div class="pacts"><button class="btn plain" id="del"><span style="color:#A3502A">${esc(t('delete'))}</span></button></div>
    </div>`:''}
    <div class="row">${btn(tf('ui.close','關起來'),'','id="no"')}</div>`);
  const E=v.querySelector('#e');
  // 關起來時，如果有改過東西，牆上的記號要跟著更新
  const close=()=>{v.remove();if(dirty&&S.tab==='proj')render();};
  v.onclick=e=>{if(e.target===v)close();};
  v.querySelector('.x').onclick=close;
  v.querySelector('#no').onclick=close;
  bindStamps(v);
  getFull(id).then(u=>{const im=v.querySelector('#pv');if(im&&u)im.src=u;}).catch(()=>{});

  // 說明：有改才出現「存好」
  const cap=v.querySelector('#cap'),cs=v.querySelector('#capsave');
  if(cap){
    cap.oninput=()=>cs.classList.toggle('hide',cap.value===(p.caption||''));
    v.querySelector('#capok').onclick=async()=>{
      const b=v.querySelector('#capok');b.disabled=true;E.innerHTML='<span class="spin"></span>';
      try{await api('updatePhoto',{id,caption:cap.value});p.caption=cap.value;dirty=true;
        cs.classList.add('hide');E.textContent='';}
      catch(e){E.textContent=e.message;}
      b.disabled=false;
    };
  }

  // 留言
  const drawCmts=()=>{
    const box=v.querySelector('#cmts'),list=commentsFor(id);
    box.innerHTML=list.length?list.map(c=>`<div class="cmt">${whoTag(c.owner)}
      <span class="ct">${richText(c.text)}</span>
      <span class="cd">${esc(pDate(c.createdAt))}</span>
      ${c.owner===S.user?`<button class="cb del" data-cdel="${esc(c.id)}" aria-label="${esc(t('delete'))}">✕</button>`:''}</div>`).join('')
      :`<p class="cap sys" style="margin:2px 0 0">${esc(PT('noReplies','還沒有人留言'))}</p>`;
    box.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>confirmDelete('quote',async()=>{
      await api('deleteComment',{id:b.dataset.cdel});
      S.proj.comments=S.proj.comments.filter(x=>x.id!==b.dataset.cdel);dirty=true;drawCmts();
    }));
  };
  drawCmts();
  const cm=v.querySelector('#cm'),cms=v.querySelector('#cms');
  cms.onclick=async()=>{
    const text=cm.value.trim();if(!text)return;
    cms.disabled=true;E.innerHTML='<span class="spin"></span>';
    try{
      const c=await api('addComment',{targetId:id,text});
      (S.proj.comments||(S.proj.comments=[])).push(c);dirty=true;
      cm.value='';E.textContent='';drawCmts();
    }catch(e){E.textContent=e.message;}
    cms.disabled=false;
  };

  const cv=v.querySelector('#cover');
  if(cv)cv.onclick=async()=>{
    cv.disabled=true;
    try{await saveProjectWith(P,{coverPhotoId:id});P.coverPhotoId=id;
      cv.outerHTML=`<span class="cap sys" style="margin:0">${esc(PT('isCover','這張是封面'))}</span>`;}
    catch(e){cv.disabled=false;E.textContent=e.message;}
  };
  const more=v.querySelector('#more');
  if(more)more.onclick=()=>{v.querySelector('#morebox').classList.toggle('hide');};
  v.querySelectorAll('[data-uc]').forEach(b=>b.onclick=async()=>{
    const next=b.dataset.uc;if(next===cat)return;
    E.innerHTML='<span class="spin"></span>';
    try{await api('updatePhoto',{id,projectCat:next});cat=next;p.projectCat=next;dirty=true;E.textContent='';
      v.querySelectorAll('[data-uc]').forEach(x=>x.classList.toggle('on',x.dataset.uc===cat));}
    catch(e){E.textContent=e.message;}
  });
  const del=v.querySelector('#del');
  if(del)del.onclick=()=>confirmDelete('photo',async()=>{
    await api('deletePhoto',{id});
    delete S.thumbCache[id];
    const store=await photoStore();
    if(store){try{await store.delete('/thumb/'+id);await store.delete('/photo/'+id);}catch(e){}}
    v.remove();await reloadProject();
  });
}

/* ── 傳完一批，一張一張補幾句 ──
   一次傳很多張時沒有機會寫字，所以傳完再給一次機會。不想寫就跳過。 */
function panelWalk(ids,i){
  const list=ids.filter(x=>S.proj&&S.proj.photos.some(p=>p.id===x));
  if(i>=list.length){Q.total=0;Q.mine=[];if(S.tab==='proj')render();return;}
  const p=S.proj.photos.filter(x=>x.id===list[i])[0];
  const last=i+1>=list.length;
  const v=panel(`<p class="cap sys" style="margin:0 0 10px">${i+1} / ${list.length}　${esc(catName(S.proj.project.photoCats,p.projectCat))}</p>
    <img class="preview" id="pv" src="${S.thumbCache[p.id]||''}" alt="">
    <div class="field"><textarea id="cap" rows="3" placeholder="${esc(PT('captionHint','寫一點這張的事'))}">${esc(p.caption)}</textarea></div>
    <div class="err" id="e"></div>
    <div class="row">${btn(PT('skip','跳過'),'','id="no"')}${btn(last?tf('ui.save','存好'):PT('saveNext','存好，下一張'),'warm','id="ok"')}</div>`);
  getFull(p.id).then(u=>{const im=v.querySelector('#pv');if(im&&u)im.src=u;}).catch(()=>{});
  // 按 ✕ 或點外面＝今天先到這裡
  const stop=()=>{v.remove();if(S.tab==='proj')render();};
  v.onclick=e=>{if(e.target===v)stop();};
  v.querySelector('.x').onclick=stop;
  v.querySelector('#no').onclick=()=>{v.remove();panelWalk(ids,i+1);};
  const ok=v.querySelector('#ok');
  ok.onclick=async()=>{
    const text=v.querySelector('#cap').value;
    if(text!==(p.caption||'')){
      ok.disabled=true;v.querySelector('#e').innerHTML='<span class="spin"></span>';
      try{await api('updatePhoto',{id:p.id,caption:text});p.caption=text;}
      catch(e){ok.disabled=false;v.querySelector('#e').textContent=e.message;return;}
    }
    v.remove();panelWalk(ids,i+1);
  };
  setTimeout(()=>{const c=v.querySelector('#cap');if(c)c.focus();},60);
}

    <div class="field"><textarea id="tx" rows="5">${esc(existing?existing.text:'')}</textarea></div>
